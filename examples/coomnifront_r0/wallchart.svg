<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
<title id="title">CoOmniFront plus CoTimeBraid: One work identity, many observer lenses, several futures</title>
<desc id="desc">The left panel shows prior evidence pushing a decision toward the present. The right shows desired futures pulling planning back toward the present. Outside shocks challenge the present. One work identity and evidence spine support six different human and machine views with an outcome and recovery feedback loop. This is conceptual, not live runtime.</desc>
<defs><linearGradient id="bg" x2="1" y2="1"><stop offset="0%" stop-color="#0b1223"/><stop offset="100%" stop-color="#17172c"/></linearGradient></defs>
<style>
text{font-family:Arial,Helvetica,sans-serif;fill:#e9ecff} .h{font-size:29px;font-weight:bold}.s{font-size:20px;fill:#bec7e2}.t{font-size:17px;fill:#c4cfe7}.k{font-size:17px;font-weight:bold;letter-spacing:1px}.panel{fill:#18233b;stroke:#42516d;stroke-width:2}.lens{fill:#222941;stroke:#5b6785;stroke-width:1.5}
</style>
<rect width="1600" height="900" fill="url(#bg)"/>
<text x="55" y="65" font-size="43" font-weight="bold">One field. Multiple minds. Several futures.</text>
<text x="57" y="105" class="s">CoOmniFront+ / CoTimeBraid+ R0  •  same evidence, distinct perspectives and permissions</text>
<rect x="45" y="145" width="470" height="310" rx="18" class="panel"/>
<rect x="565" y="145" width="470" height="310" rx="18" class="panel"/>
<rect x="1085" y="145" width="470" height="310" rx="18" class="panel"/>
<rect x="45" y="145" width="8" height="310" rx="4" fill="#f4c271"/>
<rect x="565" y="145" width="8" height="310" rx="4" fill="#40dac5"/>
<rect x="1085" y="145" width="8" height="310" rx="4" fill="#ec87ce"/>
<text x="76" y="185" class="k">PAST  →  PRESENT</text>
<text x="76" y="230" class="h">Prior push</text>
<text x="76" y="278" class="s">Evidence, history and commitments</text>
<text x="76" y="326" class="s">Decisions • dissent • failures</text>
<text x="76" y="363" class="s">Source identity • time • receipts</text>
<text x="76" y="400" class="t">Historical evidence is not current authority.</text>
<text x="596" y="185" class="k">HERE AND NOW</text>
<text x="596" y="230" class="h">Current decision</text>
<text x="596" y="278" class="s">Observed reality and resources</text>
<text x="596" y="326" class="s">Permissions • choices • uncertainty</text>
<text x="596" y="363" class="s">One bounded deed or HOLD</text>
<text x="596" y="400" class="t">Visible success requires independent proof.</text>
<text x="1116" y="185" class="k">FUTURE  →  PRESENT</text>
<text x="1116" y="230" class="h">Attractor pull</text>
<text x="1116" y="278" class="s">Preferred outcomes, not future facts</text>
<text x="1116" y="326" class="s">Scenarios • backcasting • milestones</text>
<text x="1116" y="363" class="s">Predictions • falsifiers • deadlines</text>
<text x="1116" y="400" class="t">A preference is not a calibrated forecast.</text>
<path d="M518 244 L556 244" stroke="#40dac5" stroke-width="6"/><path d="M548 234 L561 244 L548 254" stroke="#40dac5" stroke-width="4" fill="none"/>
<path d="M1083 244 L1045 244" stroke="#ec87ce" stroke-width="6"/><path d="M1053 234 L1040 244 L1053 254" stroke="#ec87ce" stroke-width="4" fill="none"/>
<rect x="45" y="482" width="1510" height="88" rx="16" class="lens"/>
<text x="76" y="519" class="h">Crosswinds + challenge</text>
<text x="76" y="549" class="t">External research, competing strategies, changing laws, community needs, threats, null results and surprises</text>
<rect x="45" y="595" width="1510" height="64" rx="14" fill="#242b4d" stroke="#9e98f9" stroke-width="2"/>
<text x="75" y="636" font-size="24" font-weight="bold">ONE DURABLE WORK ID</text>
<text x="405" y="636" class="s">provenance • time • evidence class • consent • receiver • recovery • dissent</text>
<text x="50" y="702" font-size="25" font-weight="bold">One source, six observer views</text>
<g>
<rect x="45" y="723" width="233" height="91" rx="12" class="lens"/>
<rect x="298" y="723" width="233" height="91" rx="12" class="lens"/>
<rect x="551" y="723" width="233" height="91" rx="12" class="lens"/>
<rect x="804" y="723" width="233" height="91" rx="12" class="lens"/>
<rect x="1057" y="723" width="233" height="91" rx="12" class="lens"/>
<rect x="1310" y="723" width="245" height="91" rx="12" class="lens"/>
<text x="62" y="755" font-size="22" font-weight="bold">Public / People</text><text x="62" y="790" class="t">Meaning • agency</text>
<text x="315" y="755" font-size="22" font-weight="bold">Board / CoOrg</text><text x="315" y="790" class="t">Strategy • risks</text>
<text x="568" y="755" font-size="22" font-weight="bold">Research</text><text x="568" y="790" class="t">Falsifiers • data</text>
<text x="821" y="755" font-size="22" font-weight="bold">Engineering</text><text x="821" y="790" class="t">Schema • recovery</text>
<text x="1074" y="755" font-size="22" font-weight="bold">Agents</text><text x="1074" y="790" class="t">Limits • receipts</text>
<text x="1327" y="755" font-size="22" font-weight="bold">Mobile / Access</text><text x="1327" y="790" class="t">Glance • consent</text>
</g>
<text x="50" y="847" class="s">Independent result → exact receipt → compare forecast against observation → revise priors and possible futures</text>
<text x="50" y="882" class="t">PUBLIC DESIGN PROPOSAL  •  NOT LIVE SESSION SYNC  •  PREDICTION ≠ OBSERVATION  •  LOCAL UI ≠ REMOTE RECEIVER</text>
</svg>
