name: CoGoAll unattended proof pulse
on:
  push:
    paths:
      - '.github/workflows/cogoall-unattended-proof-pulse.yml'
      - 'examples/cotalkitout/progress_receipt_gate_r0.py'
      - 'test_progress_receipt_gate_r0.py'
      - 'examples/cotalkitout/scheduled_pulse_readback_r0.py'
      - 'test_scheduled_pulse_readback_r0.py'
      - 'examples/cotalkitout/due_work_catchup_r0.py'
      - 'examples/cotalkitout/local_source_work_cycle_r0.py'
      - 'test_due_work_catchup_r0.py'
      - 'test_local_source_work_cycle_r0.py'
      - 'scripts/CoReboundIntegrityR0.py'
      - 'scripts/copre_seed_24h_canary_r0.py'
      - 'scripts/test_copre_seed_24h_canary_r0.py'
      - 'tests/test_corebound_integrity_r0.py'
      - 'docs/Onramp/COGOALL_PUBLIC_REBOUND_HUB_20261108.md'
      - 'docs/Onramp/AI_ONRAMP_CATCHUP_HUB_20261108.md'
      - 'ai/index.json'
      - 'ai/evolution-lanes.json'
      - 'CoPre.md'
      - 'SESSION_BOOTSTRAP.md'
      - 'ai/session-bootstrap.json'
      - 'tests/test_colocal_role_rebind_r0.py'
      - 'scripts/CoSessionAutoTurnR1.py'
      - 'scripts/CoSessionDeltaGuardR1.py'
      - 'tests/test_cosession_delta_guard_r1.py'
      - 'tests/test_cosession_auto_turn_r1.py'
      - 'ai/session-autoturn-public-sources-r1.json'
      - 'scripts/CoLocalRoleRebindR0.py'
      - 'ai/currentness/colocal-x2-postcontainment-focus-20261112-r1.json'
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: cogoall-proof-pulse
  cancel-in-progress: false
jobs:
  proof:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check role-scoped CoLocal reentry without an X2 shell
        run: python -B -m unittest discover -s tests -p 'test_colocal_role_rebind_r0.py' -v
      - name: Elect and verify one public-only CoSession logical turn
        shell: bash
        run: |
          set -euo pipefail
          python -B -m unittest discover -s tests -p 'test_cosession_auto_turn_r1.py' -v
          python -B scripts/CoSessionAutoTurnR1.py --output auto-turn-r1.json
      - name: Suppress unchanged public WorkIDs using bounded prior successful receipt
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p out/autoturn/prior
          python -B -m unittest discover -s tests -p 'test_cosession_delta_guard_r1.py' -v
          gh api -X GET "repos/$GITHUB_REPOSITORY/actions/workflows/cogoall-unattended-proof-pulse.yml/runs?branch=main&status=success&per_page=15" > out/autoturn-candidates.json || printf '%s\n' '{"workflow_runs":[]}' > out/autoturn-candidates.json
          python - <<'PY'
          import json,os,pathlib
          p=pathlib.Path("prior-autoturn-metadata.json")
          try:
              runs=json.loads(pathlib.Path("out/autoturn-candidates.json").read_text())["workflow_runs"]
          except (ValueError,KeyError,TypeError):
              runs=[]
          candidates=sorted((r for r in runs if
              r.get("status")=="completed" and r.get("conclusion")=="success"
              and r.get("head_branch")=="main" and r.get("id",0)<int(os.environ["GITHUB_RUN_ID"])
              and r.get("path")==".github/workflows/cogoall-unattended-proof-pulse.yml"),
              key=lambda x:x["id"],reverse=True)
          chosen=candidates[0] if candidates else None
          data={"repository":"CoCivium/CoCivium",
                "workflow_path":".github/workflows/cogoall-unattended-proof-pulse.yml",
                "retrieval_state":"UNAVAILABLE",
                "conclusion":chosen["conclusion"] if chosen else None,
                "run_id":str(chosen["id"]) if chosen else None,
                "attempt":str(chosen.get("run_attempt",1)) if chosen else None,
                "head_sha":chosen.get("head_sha") if chosen else None,
                "artifact_name":("cogoall-proof-"+str(chosen["id"])+"-"+str(chosen.get("run_attempt",1))) if chosen else None}
          p.write_text(json.dumps(data,sort_keys=True,indent=2)+"\n")
          print("PRIOR_LOOKUP:", "ELIGIBLE_CANDIDATE" if chosen else "HOLD_NO_PRIOR")
          PY
          prior_id=$(python -c "import json;print(json.load(open('prior-autoturn-metadata.json')).get('run_id') or '')")
          prior_artifact=$(python -c "import json;print(json.load(open('prior-autoturn-metadata.json')).get('artifact_name') or '')")
          if [ -n "$prior_id" ]; then
            if gh run download "$prior_id" --repo "$GITHUB_REPOSITORY" --name "$prior_artifact" --dir out/autoturn/prior >/dev/null 2>&1; then
              if [ -s out/autoturn/prior/auto-turn-r1.json ]; then
                cp out/autoturn/prior/auto-turn-r1.json prior-auto-turn-r1.json
              fi
            fi
          fi
          python - <<'PY'
          import json,pathlib
          p=pathlib.Path("prior-autoturn-metadata.json")
          m=json.loads(p.read_text())
          f=pathlib.Path("prior-auto-turn-r1.json")
          if f.is_file():
              try:
                  old=json.loads(f.read_text())
                  run=old["run"]
                  if run["run_id"]==m["run_id"] and run["attempt"]==m["attempt"] and run["head_sha"]==m["head_sha"]:
                      m["retrieval_state"]="VERIFIED_SUCCESSFUL_GITHUB_RUN_ARTIFACT"
              except (KeyError,ValueError,TypeError):
                  pass
          p.write_text(json.dumps(m,sort_keys=True,indent=2)+"\n")
          print("PRIOR_ARTIFACT:",m["retrieval_state"])
          PY
          python -B scripts/CoSessionDeltaGuardR1.py --current auto-turn-r1.json --prior prior-auto-turn-r1.json --metadata prior-autoturn-metadata.json --output delta-guard-r1.json
      - name: Verify one-shot durable local source WorkID (no external effect)
        run: python -B -m unittest -v test_local_source_work_cycle_r0
      - name: Execute real public CoPre source with one local durable WorkID
        shell: bash
        run: |
          set -euo pipefail
          db="$RUNNER_TEMP/cogoall-source-check.sqlite"
          python -B -m examples.cotalkitout.local_source_work_cycle_r0 --root . --db "$db" > source-check-first.json
          python -B -m examples.cotalkitout.local_source_work_cycle_r0 --root . --db "$db" > source-check-replay.json
          python - <<'PY' | tee source-check.log
          import hashlib, json, pathlib
          initial=json.loads(pathlib.Path('source-check-first.json').read_text())
          repeat=json.loads(pathlib.Path('source-check-replay.json').read_text())
          source=hashlib.sha256(pathlib.Path('CoPre.md').read_bytes()).hexdigest()
          assert initial['state']=='COMMITTED_LOCAL_ONLY'
          assert repeat['state']=='LOCAL_REPLAY_OR_LEASED' and repeat['queue_state']=='DONE'
          assert initial['work_id']==repeat['work_id']=='CoPre:source-integrity:R0'
          assert initial['source_sha256']==repeat['source_sha256']==source
          assert initial['external_receiver_ack'] is False
          assert initial['real_external_effect'] is False
          assert repeat['external_receiver_ack'] is False
          print(json.dumps(dict(state='CI_LOCAL_SOURCE_WORKID_REPLAY_VERIFIED',
              source_sha256=source, work_id=initial['work_id'],
              local_result_sha256=initial['local_result_sha256'],
              independent_receiver_ack=False, external_effect_verified=False),
              sort_keys=True))
          PY
      - name: Exercise bounded recovery and handoff gates
        id: tests
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          python -B examples/cotalkitout/decision_gate_r0.py 2>&1 | tee decision.log
          python -B examples/cotalkitout/cograce_recovery_r0.py 2>&1 | tee grace.log
          python -B examples/cotalkitout/cosuccession_handoff_r0.py 2>&1 | tee succession.log
          python -B examples/cotalkitout/cogoall_acceptance_gate_r0.py 2>&1 | tee acceptance.log
          python -B -m unittest -v test_progress_receipt_gate_r0 2>&1 | tee progress.log
          python -B -m unittest -v test_scheduled_cadence_audit_r0 2>&1 | tee cadence-tests.log
          python -B -m unittest -v test_due_work_catchup_r0 2>&1 | tee catchup-tests.log
          python -B -m unittest discover -s tests -p 'test_corebound_integrity_r0.py' -v 2>&1 | tee rebound-tests.log
          python -B scripts/CoReboundIntegrityR0.py --root . --output rebound-report.json 2>&1 | tee rebound-links.log
      - name: Observe actual scheduled wake coverage from GitHub Actions
        if: always()
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python -B examples/cotalkitout/scheduled_cadence_audit_r0.py
      - name: Verify prospective second-job receipt contract
        run: python -B -m unittest -v test_scheduled_pulse_readback_r0.py
      - name: Produce immutable run-scoped evidence
        if: always()
        env:
          TEST_OUTCOME: ${{ steps.tests.outcome }}
          RUN_ID: ${{ github.run_id }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
          COMMIT_SHA: ${{ github.sha }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          python - <<'PY'
          import datetime, hashlib, json, os, pathlib
          logs = {}
          for name in ('decision', 'grace', 'succession', 'acceptance', 'progress', 'cadence-tests', 'catchup-tests', 'rebound-tests', 'rebound-links', 'source-check'):
              p = pathlib.Path(name + '.log')
              logs[name] = hashlib.sha256(p.read_bytes()).hexdigest() if p.exists() else None
          cadence = pathlib.Path('schedule-audit.json')
          rebound = pathlib.Path('rebound-report.json')
          record = dict(schema='cogoall-proof-pulse-r1',
                        observed_at_utc=datetime.datetime.now(datetime.timezone.utc).isoformat(),
                        run_id=os.environ['RUN_ID'], attempt=os.environ['RUN_ATTEMPT'],
                        head=os.environ['COMMIT_SHA'], event=os.environ['EVENT_NAME'],
                        outcome=os.environ['TEST_OUTCOME'], log_sha256=logs,
                        schedule_audit_sha256=hashlib.sha256(cadence.read_bytes()).hexdigest() if cadence.exists() else None,
                        rebound_audit_sha256=hashlib.sha256(rebound.read_bytes()).hexdigest() if rebound.exists() else None,
                        claims=['SOURCE_TESTS_ONLY', 'NO_X2_RECEIVER_ACK', 'NO_24H_SEED_PROOF'])
          pathlib.Path('proof-receipt.json').write_text(json.dumps(record, sort_keys=True, indent=2)+'\n')
          PY
      - name: Upload run-scoped receipt and logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cogoall-proof-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            proof-receipt.json
            auto-turn-r1.json
            delta-guard-r1.json
            prior-autoturn-metadata.json
            prior-auto-turn-r1.json
            decision.log
            grace.log
            succession.log
            acceptance.log
            progress.log
            cadence-tests.log
            catchup-tests.log
            rebound-tests.log
            rebound-links.log
            source-check.log
            rebound-report.json
            schedule-audit.json
          if-no-files-found: error
          retention-days: 30
      - name: Fail closed when source tests failed
        if: steps.tests.outcome != 'success'
        run: exit 1

  pulse-receiver:
    needs: proof
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Download exact run-scoped proof from upstream job
        uses: actions/download-artifact@v4
        with:
          name: cogoall-proof-${{ github.run_id }}-${{ github.run_attempt }}
          path: out/cogoall/pulse-source
      - name: Verify actual source receipt, cadence and log hashes
        run: |
          python -B examples/cotalkitout/scheduled_pulse_readback_r0.py \
            --source-dir out/cogoall/pulse-source \
            --receipt out/cogoall/pulse-receiver/readback.json
          python -m json.tool out/cogoall/pulse-receiver/readback.json >/dev/null
      - name: Recompute one CoSession logical turn in the separate CI receiver job
        run: |
          python -B scripts/CoSessionAutoTurnR1.py \
            --check out/cogoall/pulse-source/auto-turn-r1.json \
            --receipt out/cogoall/pulse-receiver/autoturn-readback.json
          python -m json.tool out/cogoall/pulse-receiver/autoturn-readback.json >/dev/null
      - name: Recompute public source-delta quietness and prior identity in receiver
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          prior=out/cogoall/pulse-source/prior-autoturn-metadata.json
          state=$(python -c "import json,sys;print(json.load(open(sys.argv[1]))['retrieval_state'])" "$prior")
          if [ "$state" = "VERIFIED_SUCCESSFUL_GITHUB_RUN_ARTIFACT" ]; then
            runid=$(python -c "import json,sys;print(json.load(open(sys.argv[1]))['run_id'])" "$prior")
            gh api -X GET "repos/$GITHUB_REPOSITORY/actions/runs/$runid" > out/cogoall/prior-github-run.json
            python - <<'PY'
          import json,pathlib
          m=json.loads(pathlib.Path("out/cogoall/pulse-source/prior-autoturn-metadata.json").read_text())
          r=json.loads(pathlib.Path("out/cogoall/prior-github-run.json").read_text())
          assert r["status"]=="completed" and r["conclusion"]=="success"
          assert str(r["id"])==m["run_id"] and str(r["run_attempt"])==m["attempt"]
          assert r["head_sha"]==m["head_sha"] and r["path"]==m["workflow_path"]
          assert r["head_branch"]=="main"
          print("PRIOR_SUCCESS_CONFIRMED_FROM_RECEIVER_JOB")
          PY
          fi
          python -B scripts/CoSessionDeltaGuardR1.py --current out/cogoall/pulse-source/auto-turn-r1.json --prior out/cogoall/pulse-source/prior-auto-turn-r1.json --metadata "$prior" --check out/cogoall/pulse-source/delta-guard-r1.json --receipt out/cogoall/pulse-receiver/delta-guard-readback.json
      - name: Upload independently generated CI-scoped readback
        uses: actions/upload-artifact@v4
        with:
          name: cogoall-pulse-readback-${{ github.run_id }}-${{ github.run_attempt }}
          path: out/cogoall/pulse-receiver/
          if-no-files-found: error
          retention-days: 30

  seed24h-qualification:
    # Reuse the existing hourly pulse. This observes historical source bytes,
    # not runtime, cross-provider pickup, or scheduled cadence guarantees.
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Assert fail-closed 24-hour qualification controls
        run: python -B scripts/test_copre_seed_24h_canary_r0.py -v
      - name: Retrieve the actual first-run GitHub artifact (not a reconstructed timestamp)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p out/copre-seed24h/prior
          gh run download 42729597075 --repo "${{ github.repository }}" \
            --name copre-seed24h-observation --dir out/copre-seed24h/prior
          python - <<'PY'
          import json, pathlib
          from scripts.copre_seed_24h_canary_r0 import SCHEMA, PINNED_COMMIT, EXPECTED_SHA256
          p=pathlib.Path('out/copre-seed24h/prior/copre-seed24h-observation.json')
          x=json.loads(p.read_text(encoding='utf-8'))
          assert x['schema']==SCHEMA and x['source_commit']==PINNED_COMMIT
          assert x['sha256']==EXPECTED_SHA256 and x['state']=='PINNED_SOURCE_MATCH'
          assert x['workflow_run_id']=='42729597075'
          assert x['observed_at']=='2026-11-10T00:36:47.681591+00:00'
          assert x['qualification']=='BASELINE_ONLY'
          print('HISTORICAL_BASELINE_ARTIFACT_RETRIEVED_AND_VALIDATED')
          PY
      - name: Refetch pinned CoPre and compare with actual baseline after elapsed time
        run: |
          mkdir -p out/copre-seed24h
          python -B scripts/copre_seed_24h_canary_r0.py \
            --output out/copre-seed24h/current.json \
            --prior out/copre-seed24h/prior/copre-seed24h-observation.json
          python - <<'PY'
          import json
          x=json.load(open('out/copre-seed24h/current.json', encoding='utf-8'))
          print('SEED24H_QUALIFICATION:', x['qualification'])
          print('MAINLINE_CURRENTNESS:', x['mainline']['comparison'])
          # The historical source can now be rechecked after the actual 24h
          # boundary. A green job must mean the qualification is real, not
          # merely that the script printed an explicit HELD classification.
          expected='VERIFIED_SOURCE_REFETCH_24H_PLUS_NOT_RUNTIME_SURVIVAL'
          if x['qualification'] != expected:
              raise SystemExit('HOLD_24H_SOURCE_QUALIFICATION: '+x['qualification'])
          assert x['state']=='PINNED_SOURCE_MATCH'
          assert x['sha256']=='58f8c722bfbfc34cac41189c072d2effe4b19dbbe8a37be4f8687344d6b00b9a'
          assert x['receiver_ack'] is False and x['current_seed_synchronized'] is False
          assert x['exactly_once_effect_handoff'] is False and x['coex'] is False
          PY
      - name: Keep readproof or failure boundary, never fabricated 24h success
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: copre-seed24h-recheck-${{ github.run_id }}-a${{ github.run_attempt }}
          path: |
            out/copre-seed24h/current.json
            out/copre-seed24h/prior/copre-seed24h-observation.json
          if-no-files-found: warn
          retention-days: 30
