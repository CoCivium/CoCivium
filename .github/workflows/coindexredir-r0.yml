name: CoIndexRedir R0 source gate
on:
  pull_request:
    paths:
      - 'ai/coindexredir-route-register-r0.json'
      - 'docs/Launch/coindexredir_r0/**'
      - 'scripts/check_coindexredir_r0.py'
      - '.github/workflows/coindexredir-r0.yml'
  workflow_dispatch:
jobs:
  verify-candidate:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python3 scripts/check_coindexredir_r0.py
