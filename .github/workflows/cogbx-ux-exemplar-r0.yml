name: CoGbx UX Exemplar R0

permissions:
  contents: read

on:
  pull_request:
    paths:
      - "docs/Architecture/COGBX_UNIVERSAL_UX_EXEMPLAR_R0_20261027.md"
      - "examples/cogbx_ux_exemplar_r0/**"
      - "examples/cobar/**"
      - ".github/workflows/cogbx-ux-exemplar-r0.yml"
  push:
    paths:
      - "docs/Architecture/COGBX_UNIVERSAL_UX_EXEMPLAR_R0_20261027.md"
      - "examples/cogbx_ux_exemplar_r0/**"
      - "examples/cobar/**"
      - ".github/workflows/cogbx-ux-exemplar-r0.yml"

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Smoke static exemplar
        run: node examples/cogbx_ux_exemplar_r0/smoke.cjs
      - name: Run R1 accessible input interactions
        run: node examples/cogbx_ux_exemplar_r0/interaction_r1.cjs
      - name: Check CoBar R4b exact-source synthetic local interaction
        run: node examples/cobar/interaction_r4b.cjs
      - name: Check CoCopy/CoBar fast bulk-insert adversarial contract
        run: node examples/cobar/test_copaste_bulk_r0.cjs
      - name: Check CoCopy/CoPaste real headless Chrome DOM insertion
        run: node examples/cobar/test_copaste_browser_r0.cjs
      - name: Verify CoCopy owned-field product canary in headless Chrome
        run: node examples/cobar/test_copaste_owned_field_browser_r0.cjs
      - name: Check source boundaries
        run: |
          python - <<'PY'
          from pathlib import Path
          arch = Path("docs/Architecture/COGBX_UNIVERSAL_UX_EXEMPLAR_R0_20261027.md").read_text()
          readme = Path("examples/cogbx_ux_exemplar_r0/README.md").read_text()
          for rail in [
              "WORK_NE_WINDOW",
              "3D_NE_MANDATORY",
              "NO_CROWN_NE_NO_STEWARDSHIP",
              "PREDICTED_NE_AUTHORIZED",
              "PERSONALIZATION_NE_CAPTURE",
              "ZILLIONS_LOGICAL_NE_ZILLIONS_VISIBLE",
          ]:
              assert rail in arch, rail
          assert "Not deployed to CoGbx.org" in readme
          print("PASS_COGBX_UX_SOURCE_BOUNDARIES_R0")
          PY

  wpf-bulk:
    runs-on: windows-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Qualify owned WPF text insertion without showing a window
        shell: pwsh
        run: pwsh -STA -NoProfile -NonInteractive -File examples/cobar/Test-CoCopyWpfBulkInputR0.ps1
      - name: Prove read-only CoBar native WorkID view holds false authority
        shell: pwsh
        run: pwsh -STA -NoProfile -NonInteractive -File examples/cobar/Test-CoBarWorkIDWindowR0.ps1
