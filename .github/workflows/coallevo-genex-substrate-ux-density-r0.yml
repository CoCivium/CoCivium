          grep -q 'CLI_NE_USER_UX_REQUIREMENT' docs/Architecture/COALLEVO_GENEX_SUBSTRATE_UX_DENSITY_R0.md
          grep -q 'GLYPH_NE_FULL_SEMANTICS' docs/Architecture/COALLEVO_GENEX_SUBSTRATE_UX_DENSITY_R0.md
