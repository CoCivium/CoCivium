name: CoField Self Regulation R0H

on:
  pull_request:
    paths:
      - "docs/Architecture/COFIELD_SELF_REGULATION_R0H.md"
      - "fixtures/architecture/cofield_self_regulation_r0h.json"
      - "tools/validate_cofield_self_regulation_r0h.py"
      - ".github/workflows/cofield-self-regulation-r0h.yml"
      - "docs/Architecture/COFIELD_MESH_BRIDGE_R0G.md"
      - "fixtures/architecture/cofield_mesh_bridge_r0g.json"
      - "docs/Architecture/COBRANCH_CONVERGENCE_DISPOSITION_R0C.md"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out exact candidate head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 1
      - name: Use Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate field self-regulation and quiet projection
        run: python tools/validate_cofield_self_regulation_r0h.py
