name: CoSource record contract

on:
  pull_request:
    paths:
      - 'schemas/cosource-record-v0.1.schema.json'
      - 'examples/cosource-record-v0.1.example.json'
      - 'docs/Architecture/COSOURCE_GRAPH_R0.md'
      - '.github/workflows/cosource-record-contract.yml'
  push:
    branches: [main]
    paths:
      - 'schemas/cosource-record-v0.1.schema.json'
      - 'examples/cosource-record-v0.1.example.json'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install validator
        run: python -m pip install --disable-pip-version-check jsonschema==4.23.0
      - name: Validate example
        shell: python
        run: |
          import json
          from pathlib import Path
          from jsonschema import Draft202012Validator
          schema = json.loads(Path("schemas/cosource-record-v0.1.schema.json").read_text(encoding="utf-8"))
          example = json.loads(Path("examples/cosource-record-v0.1.example.json").read_text(encoding="utf-8"))
          Draft202012Validator.check_schema(schema)
          errors = sorted(Draft202012Validator(schema).iter_errors(example), key=lambda e: list(e.path))
          if errors:
              for error in errors:
                  print(f"{list(error.path)}: {error.message}")
              raise SystemExit(1)
          print("PASS_COSOURCE_RECORD_CONTRACT_V0_1")
