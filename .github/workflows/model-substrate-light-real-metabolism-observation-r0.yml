name: Model substrate-light real metabolism observation R0

on:
  pull_request:
    paths:
      - "docs/Architecture/COMODEL_SUBSTRATE_LIGHT_REAL_METABOLISM_OBSERVATION_R0.md"
      - "evidence/substrate/metabolism-observations-r0/**"
      - "tools/compile_model_substrate_light_real_metabolism_observation_r0.py"
      - ".github/workflows/model-substrate-light-real-metabolism-observation-r0.yml"
      - "fixtures/substrate/model_substrate_light_metabolism_loop_r0.json"
      - "fixtures/substrate/model_substrate_light_benefit_oomph_r0.json"
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  metabolism-observer:
    runs-on: ubuntu-latest
    steps:
      - name: Check out exact candidate head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 1

      - name: Use Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Download exact controlled counterfactual fan-in
        uses: actions/download-artifact@v4
        with:
          name: model-substrate-light-controlled-counterfactual-fanin-r0
          path: source-artifact
          github-token: ${{ github.token }}
          repository: CoCivium/CoCivium
          run-id: 36737453263

      - name: Compile real receipt into advisory metabolism observation
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python tools/compile_model_substrate_light_real_metabolism_observation_r0.py --downloaded-receipt source-artifact/controlled-counterfactual-fanin-r0.json --output artifacts/real-metabolism-observation-r0.json

      - name: Upload metabolism observation
        uses: actions/upload-artifact@v4
        with:
          name: model-substrate-light-real-metabolism-observation-r0
          path: artifacts/real-metabolism-observation-r0.json
          if-no-files-found: error
          retention-days: 30
