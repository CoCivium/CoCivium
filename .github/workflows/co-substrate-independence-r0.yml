name: CoSubstrate Independence R0

on:
  pull_request:
    paths:
      - "docs/Architecture/CO_SUBSTRATE_INDEPENDENCE_R0.md"
      - "docs/Architecture/CO_SUBSTRATE_INDEPENDENCE_FIELD_CROSSWALK_R0.md"
      - "fixtures/substrate/co_substrate_migration_r0.json"
      - "fixtures/substrate/co_substrate_migration_r0.adversarial.json"
      - "fixtures/substrate/co_substrate_field_projection_r0.json"
      - "fixtures/substrate/co_substrate_continuity_claims_r0.json"
      - "fixtures/substrate/co_substrate_multi_federation_r0.json"
      - "fixtures/substrate/co_substrate_cross_host_object_r0.json"
      - "tools/validate_co_substrate_migration_r0.py"
      - "tools/validate_co_substrate_field_projection_r0.py"
      - "tools/validate_co_substrate_continuity_claims_r0.py"
      - "tools/validate_co_substrate_multi_federation_r0.py"
      - "tools/emit_co_substrate_cross_host_attestation_r0.py"
      - "tools/validate_co_substrate_cross_host_attestations_r0.py"
      - "tools/emit_co_substrate_cross_runtime_python_r0.py"
      - "tools/emit_co_substrate_cross_runtime_node_r0.js"
      - "tools/validate_co_substrate_cross_runtime_attestations_r0.py"
      - "tools/validate_co_substrate_receiver_proof_convergence_r0.py"
      - "tools/generate_co_substrate_model_runtime_canary_r0.py"
      - "tools/emit_co_substrate_model_runtime_onnx_r0.py"
      - "tools/emit_co_substrate_model_runtime_openvino_r0.py"
      - "tools/validate_co_substrate_model_runtime_attestations_r0.py"
      - ".github/workflows/co-substrate-independence-r0.yml"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate CoSubstrate migration fixture
        run: python tools/validate_co_substrate_migration_r0.py
      - name: Validate CoSubstrateField projection binding
        run: python tools/validate_co_substrate_field_projection_r0.py
      - name: Validate continuity claim boundaries
        run: python tools/validate_co_substrate_continuity_claims_r0.py
      - name: Validate multi-substrate federation semantics
        run: python tools/validate_co_substrate_multi_federation_r0.py

  cross_host_receiver:
    env:
      CO_PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
      CO_PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Emit receiver attestation
        shell: bash
        run: python tools/emit_co_substrate_cross_host_attestation_r0.py --out cross-host-attestation.json
      - name: Upload receiver attestation
        uses: actions/upload-artifact@v4
        with:
          name: cross-host-${{ runner.os }}
          path: cross-host-attestation.json

  cross_host_fanin:
    needs: cross_host_receiver
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Download receiver attestations
        uses: actions/download-artifact@v4
        with:
          pattern: cross-host-*
          path: cross-host-attestations
      - name: Validate cross-host receiver fan-in
        run: python tools/validate_co_substrate_cross_host_attestations_r0.py cross-host-attestations

  cross_runtime_python:
    env:
      CO_PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
      CO_PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Emit Python runtime attestation
        run: python tools/emit_co_substrate_cross_runtime_python_r0.py --out cross-runtime-python.json
      - name: Upload Python runtime attestation
        uses: actions/upload-artifact@v4
        with:
          name: cross-runtime-python
          path: cross-runtime-python.json

  cross_runtime_node:
    env:
      CO_PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
      CO_PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Emit Node runtime attestation
        run: node tools/emit_co_substrate_cross_runtime_node_r0.js --out cross-runtime-node.json
      - name: Upload Node runtime attestation
        uses: actions/upload-artifact@v4
        with:
          name: cross-runtime-node
          path: cross-runtime-node.json

  cross_runtime_fanin:
    needs: [cross_runtime_python, cross_runtime_node]
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Download runtime attestations
        uses: actions/download-artifact@v4
        with:
          pattern: cross-runtime-*
          path: cross-runtime-attestations
      - name: Validate cross-runtime receiver fan-in
        run: python tools/validate_co_substrate_cross_runtime_attestations_r0.py cross-runtime-attestations

  receiver_proof_convergence:
    needs: [cross_host_fanin, cross_runtime_fanin]
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Download host attestations
        uses: actions/download-artifact@v4
        with:
          pattern: cross-host-*
          path: cross-host-attestations
      - name: Download runtime attestations
        uses: actions/download-artifact@v4
        with:
          pattern: cross-runtime-*
          path: cross-runtime-attestations
      - name: Validate proof-lane convergence
        run: python tools/validate_co_substrate_receiver_proof_convergence_r0.py cross-host-attestations cross-runtime-attestations

  model_runtime_prepare:
    env:
      CO_PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
      CO_PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install ONNX model builder
        run: python -m pip install --disable-pip-version-check onnx numpy
      - name: Generate deterministic model-runtime canary
        run: python tools/generate_co_substrate_model_runtime_canary_r0.py
      - name: Upload model-runtime canary
        uses: actions/upload-artifact@v4
        with:
          name: model-runtime-canary
          path: |
            model-runtime-canary.onnx
            model-runtime-canary-manifest.json

  model_runtime_onnx:
    needs: model_runtime_prepare
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install ONNX Runtime
        run: python -m pip install --disable-pip-version-check onnxruntime numpy
      - name: Download model-runtime canary
        uses: actions/download-artifact@v4
        with:
          name: model-runtime-canary
          path: .
      - name: Emit ONNX Runtime attestation
        run: python tools/emit_co_substrate_model_runtime_onnx_r0.py --out model-runtime-onnx.json
      - name: Upload ONNX Runtime attestation
        uses: actions/upload-artifact@v4
        with:
          name: model-runtime-onnx
          path: model-runtime-onnx.json

  model_runtime_openvino:
    needs: model_runtime_prepare
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install OpenVINO
        run: python -m pip install --disable-pip-version-check openvino numpy
      - name: Download model-runtime canary
        uses: actions/download-artifact@v4
        with:
          name: model-runtime-canary
          path: .
      - name: Emit OpenVINO attestation
        run: python tools/emit_co_substrate_model_runtime_openvino_r0.py --out model-runtime-openvino.json
      - name: Upload OpenVINO attestation
        uses: actions/upload-artifact@v4
        with:
          name: model-runtime-openvino
          path: model-runtime-openvino.json

  model_runtime_fanin:
    needs: [model_runtime_onnx, model_runtime_openvino]
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Download model-runtime attestations
        uses: actions/download-artifact@v4
        with:
          pattern: model-runtime-*
          path: model-runtime-attestations
      - name: Validate distinct inference-engine continuity
        run: python tools/validate_co_substrate_model_runtime_attestations_r0.py model-runtime-attestations
