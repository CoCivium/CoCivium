name: CoBeacon Useful Doors R0 (read-only)

permissions:
  contents: read

on:
  pull_request:
    paths:
      - "ai/beacon/experience-catalog-r0.json"
      - "examples/cobeacon_useful_doors_r0/**"
      - ".github/workflows/cobeacon-useful-doors-r0.yml"
  push:
    paths:
      - "ai/beacon/experience-catalog-r0.json"
      - "examples/cobeacon_useful_doors_r0/**"
      - ".github/workflows/cobeacon-useful-doors-r0.yml"
  schedule:
    - cron: "19 14 * * 1"
  workflow_dispatch:

jobs:
  policy-and-projection:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
      - name: Install Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Check catalog, HTML parity, policy and negative cases
        run: python -B examples/cobeacon_useful_doors_r0/check.py
      - name: Weekly bounded external source-identity check
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        run: python -B examples/cobeacon_useful_doors_r0/check.py --remote
