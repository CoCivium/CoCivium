name: Validate CoRelationField R0

on:
  pull_request:
    paths:
      - "schemas/corelation-field-v0.1.schema.json"
      - "examples/corelation-field-r0.example.json"
      - "scripts/validate_corelation_field_r0.py"
      - "docs/Architecture/CORELATION_FIELD_CAUSAL_NONCAUSAL_R0.md"
      - ".github/workflows/validate-corelation-field-r0.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Use Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install validator
        run: python -m pip install --disable-pip-version-check jsonschema==4.23.0
      - name: Validate schema fixture and relation-field invariants
        run: python scripts/validate_corelation_field_r0.py
