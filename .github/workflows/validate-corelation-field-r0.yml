name: Validate CoRelationField R0

on:
  pull_request:
    paths:
      - "schemas/corelation-field-v0.1.schema.json"
      - "examples/corelation-field-r0.example.json"
      - "docs/Architecture/CORELATION_FIELD_CAUSAL_NONCAUSAL_R0.md"
      - ".github/workflows/validate-corelation-field-r0.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Use Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install validator
        run: python -m pip install --disable-pip-version-check jsonschema==4.23.0
      - name: Validate schema fixture and relation-field invariants
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          from jsonschema import Draft202012Validator

          schema_path = Path("schemas/corelation-field-v0.1.schema.json")
          fixture_path = Path("examples/corelation-field-r0.example.json")
          schema = json.loads(schema_path.read_text(encoding="utf-8"))
          fixture = json.loads(fixture_path.read_text(encoding="utf-8"))

          Draft202012Validator.check_schema(schema)
          errors = sorted(
              Draft202012Validator(schema).iter_errors(fixture),
              key=lambda e: list(e.absolute_path),
          )
          if errors:
              print(json.dumps({
                  "STATE":"FAIL_SCHEMA",
                  "errors":[{
                      "path":".".join(str(x) for x in e.absolute_path),
                      "message":e.message
                  } for e in errors]
              }, indent=2))
              raise SystemExit(1)

          relations = fixture["relations"]
          relation_ids = [r["relation_id"] for r in relations]
          if len(relation_ids) != len(set(relation_ids)):
              raise SystemExit("FAIL_DUPLICATE_RELATION_ID")
          relation_by_id = {r["relation_id"]: r for r in relations}
          relation_id_set = set(relation_ids)
          declared_kinds = {r["ref"]: r["kind"] for r in fixture["relata"]}

          max_depth = fixture["max_relation_depth"]
          if any(r["meta_depth"] > max_depth for r in relations):
              raise SystemExit("FAIL_RELATIONAL_RECURSION_DEPTH")

          for relation in relations:
              for relatum in relation["relata"]:
                  if relatum["ref"] not in declared_kinds:
                      raise SystemExit(f"FAIL_UNDECLARED_RELATUM:{relation['relation_id']}:{relatum['ref']}")
                  if declared_kinds[relatum["ref"]] != relatum["kind"]:
                      raise SystemExit(f"FAIL_RELATUM_KIND_MISMATCH:{relation['relation_id']}:{relatum['ref']}")
                  if relatum["kind"] == "RELATION":
                      ref = relatum["ref"].removeprefix("relation:")
                      if ref not in relation_id_set:
                          raise SystemExit(f"FAIL_UNKNOWN_RELATION_RELATUM:{relation['relation_id']}:{ref}")

          if not any(r["causal_status"] == "CAUSAL_SUPPORTED" and r["mechanism"] for r in relations):
              raise SystemExit("FAIL_NO_SUPPORTED_CAUSAL_WITH_MECHANISM")
          if not any(r["causal_status"] == "COMMON_CAUSE_CANDIDATE" for r in relations):
              raise SystemExit("FAIL_NO_COMMON_CAUSE_CANDIDATE")
          if not any(r["relation_family"] == "LOGICAL_MATHEMATICAL_CONSTRAINT" and r["causal_status"] == "CAUSALITY_NOT_APPLICABLE" for r in relations):
              raise SystemExit("FAIL_LOGICAL_CAUSALITY_SEPARATION")
          if not any(
              r["causal_status"] == "CONSTRAINT_RELATION"
              and any(x["kind"] == "ABSENCE" for x in r["relata"])
              for r in relations
          ):
              raise SystemExit("FAIL_NO_ABSENCE_CONSTRAINT_CASE")
          if not any(
              any(x["kind"] == "BOUNDARY" for x in r["relata"])
              and any(x["kind"] == "UNKNOWN" for x in r["relata"])
              for r in relations
          ):
              raise SystemExit("FAIL_NO_OUTSIDE_MODEL_UNKNOWN_CASE")
          if not any(r["meta_depth"] >= 2 and r["relation_family"] == "META_RELATIONAL" for r in relations):
              raise SystemExit("FAIL_NO_RELATION_OF_RELATIONS")
          quantum = [r for r in relations if r["relation_family"] == "QUANTUM_EVIDENCE_BOUNDED"]
          if not quantum or any("QUANTUM_CORRELATION_NE_SIGNAL" not in r["nonclaims"] for r in quantum):
              raise SystemExit("FAIL_QUANTUM_NONSIGNAL_RAIL")

          for transform in fixture["transforms"]:
              if transform["source_mutated"] is not False:
                  raise SystemExit("FAIL_TRANSFORM_SOURCE_MUTATION")
              if not set(transform["source_relation_ids"]).issubset(relation_id_set):
                  raise SystemExit("FAIL_TRANSFORM_UNKNOWN_SOURCE")
              if not set(transform["output_relation_ids"]).issubset(relation_id_set):
                  raise SystemExit("FAIL_TRANSFORM_UNKNOWN_OUTPUT")
              if not transform["loss_declarations"]:
                  raise SystemExit("FAIL_TRANSFORM_LOSS_UNDECLARED")

          for projection in fixture["projections"]:
              selected = set(projection["selected_relation_ids"])
              omitted = set(projection["omitted_relation_ids"])
              if selected & omitted:
                  raise SystemExit(f"FAIL_PROJECTION_OVERLAP:{projection['projection_id']}")
              if selected | omitted != relation_id_set:
                  raise SystemExit(f"FAIL_PROJECTION_COVERAGE:{projection['projection_id']}")
              if projection["source_mutated"] is not False:
                  raise SystemExit(f"FAIL_PROJECTION_MUTATES_SOURCE:{projection['projection_id']}")
              if not projection["loss_declarations"]:
                  raise SystemExit(f"FAIL_PROJECTION_LOSS_UNDECLARED:{projection['projection_id']}")
              if projection["projection_kind"] == "CAUSAL_CHAIN":
                  for rid in selected:
                      relation = relation_by_id[rid]
                      if relation["relation_family"] != "CAUSAL":
                          raise SystemExit(f"FAIL_CAUSAL_CHAIN_CONTAINS_NONCAUSAL:{rid}")
                      if relation["causal_status"] not in {"CAUSAL_SUPPORTED","CAUSAL_CANDIDATE"}:
                          raise SystemExit(f"FAIL_CAUSAL_CHAIN_BAD_STATUS:{rid}")

          print(json.dumps({
              "STATE":"PASS_CORELATION_FIELD_R0_SYNTHETIC_VALIDATION",
              "relations":len(relations),
              "max_meta_depth":max(r["meta_depth"] for r in relations),
              "transforms":len(fixture["transforms"]),
              "projections":len(fixture["projections"]),
              "projection_coverage":"EXACT_SELECTED_PLUS_OMITTED",
              "source_mutations":0,
              "rails":[
                  "RELATION_NE_CAUSATION",
                  "CHAIN_NE_RELATION_FIELD",
                  "ABSENCE_NE_NONEXISTENCE",
                  "OUTSIDE_MODEL_NE_OUTSIDE_REALITY",
                  "QUANTUM_CORRELATION_NE_SIGNAL",
                  "PROJECTION_NE_SOURCE",
                  "MARMALIZE_REQUIRES_DELTA_PROVENANCE"
              ]
          }, separators=(",",":")))
          PY
