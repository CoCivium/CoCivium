name: CoSession exact-repeat source guard
on:
  pull_request:
    paths:
      - 'scripts/CoSessionShadowLedger.py'
      - 'scripts/test_cosession_repeat_r0.py'
      - '.github/workflows/cosession-repeat-guard.yml'
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
      - run: python3 -B -m unittest discover -s scripts -p 'test_cosession_repeat_r0.py' -v
