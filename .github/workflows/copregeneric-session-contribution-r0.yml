name: CoPreGeneric source-bound session donor R0
on:
  pull_request:
    paths:
      - 'ai/copregeneric/session-contribution-r0-20261109.json'
      - 'docs/Onramp/COPREGENERIC_SESSION_HANDOFF_R0_20261109.md'
      - 'scripts/test_copregeneric_session_contribution_r0.py'
      - 'scripts/test_copregeneric_whatsapp_package_r0.py'
      - 'ai/copregeneric/copath-front-bridge-r0-20261109.json'
      - 'scripts/CoPathSourceBridgeR0.py'
      - 'scripts/test_copath_source_bridge_r0.py'
      - 'docs/Onramp/COPATH_SOURCE_BRIDGE_R0_20261109.md'
      - 'docs/Onramp/copregeneric_whatsapp_v8x/**'
      - '.github/workflows/copregeneric-session-contribution-r0.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  candidate-contract:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Validate source-bound nonpromotion and retro-echo gaps
        run: python -B scripts/test_copregeneric_session_contribution_r0.py -v

      - name: Validate public-safe four-file derivative
        run: python -B scripts/test_copregeneric_whatsapp_package_r0.py -v
      - name: Build exact four-file SHA-256 receipt package
        shell: bash
        run: |
          set -euo pipefail
          src="docs/Onramp/copregeneric_whatsapp_v8x"
          dest="$RUNNER_TEMP/copregeneric-public-safe-four-file"
          mkdir -p "$dest"
          for f in CoPreGeneric-v1.0-DRAFT.md CoAckRewise-v8.74.md CoFeedLoop-Devs.md CoMindspace-Map.md INDEX.md; do
            cp "$src/$f" "$dest/$f"
          done
          (
            cd "$dest"
            sha256sum CoPreGeneric-v1.0-DRAFT.md CoAckRewise-v8.74.md CoFeedLoop-Devs.md CoMindspace-Map.md INDEX.md > SHA256SUMS
            sha256sum -c SHA256SUMS
            cat SHA256SUMS
          )
          printf '%s\n' 'PUBLIC_DRAFT_PR_BRANCH__NOT_CANONICAL_THREE_WAY_MIRROR' > "$dest/RECEIPT_STATE.txt"
      - name: Archive one exact shareable package
        uses: actions/upload-artifact@v4
        with:
          name: copregeneric-public-safe-four-file-r0
          path: ${{ runner.temp }}/copregeneric-public-safe-four-file/*
          if-no-files-found: error
          retention-days: 30

      - name: Validate role-bound CoPath failures and no-authority invariants
        run: python -B scripts/test_copath_source_bridge_r0.py -v
      - name: Read back eight CoPath source routes across main, PR429 and PR402
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags origin +refs/heads/main:refs/remotes/origin/main
          git fetch --no-tags origin +refs/heads/candidate/corun-priorgraph-ab-runset-r0-20261109:refs/remotes/origin/corun-donor
          mkdir -p "$RUNNER_TEMP/copath-role-readbacks"
          for role in synth bio recovery builder highlight first_contact metaanalysis lockstep; do
            python -B scripts/CoPathSourceBridgeR0.py \
              --manifest ai/copregeneric/copath-front-bridge-r0-20261109.json \
              --repo-root . --main-ref origin/main --candidate-ref HEAD --corun-ref origin/corun-donor \
              --role "$role" --strict \
              --out "$RUNNER_TEMP/copath-role-readbacks/$role.json" >/dev/null
          done
          python - <<'PY'
          import json, os, pathlib
          root = pathlib.Path(os.environ["RUNNER_TEMP"]) / "copath-role-readbacks"
          receipts = [json.loads(p.read_text()) for p in sorted(root.glob("*.json"))]
          assert len(receipts) == 8, "Expected exactly eight scoped role checks"
          for item in receipts:
              assert item["status"] in ("SOURCE_PATH_READBACK__NOT_PICKUP", "HISTORICAL_PINS_RECOVERABLE__CURRENTNESS_HELD")
              assert item["total"] == item["source_readbacks"]
              assert item["receiver_acknowledged"] is False
              assert item["cross_front_integration"] == "NOT_ESTABLISHED"
              assert item["public_mirrors_qualified"] is False
              assert item["effects"] == "NONE"
          print("Copath exact-pin recovery:", [(r["chosen_role"], r["total"], r["currentness_challenges"]) for r in receipts])
          print("All source-only, no receiver-readproof")
          PY
      - name: Archive bounded CoPath source receipts
        uses: actions/upload-artifact@v4
        with:
          name: copath-source-only-eight-role-readback-r0
          path: ${{ runner.temp }}/copath-role-readbacks/*.json
          if-no-files-found: error
          retention-days: 14
