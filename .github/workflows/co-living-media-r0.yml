name: CoLiving-media and CoMail R0 evidence gate
on:
  push:
    paths:
      - 'examples/colensmedia/**'
      - 'examples/comail_r0/**'
      - 'docs/Architecture/COFREE_EVOLVING_PUBLICATION_COMMONS_R0_20261026.md'
      - 'docs/Architecture/COPUBLICATION_FEDERATION_RECEIVER_INTEREST_R0_20261025.md'
      - 'docs/Architecture/CORELATIONSHIP_BRAID_FABRIC_R0_20261026.md'
      - 'examples/covisual_finder_r1/sources.json'
      - 'docs/Architecture/COLIVING_HIGHLIGHT_R0.md'
      - 'docs/Architecture/COMAP_COORB_COAHEAD_TEMPORAL_R0A_20261023.md'
      - 'docs/Architecture/CORELATIONAL_UX_PREDICTIVE_INPUT_R0.md'
      - 'docs/CoTheoryAll/costrawbe-r0/README.md'
      - '.github/workflows/co-living-media-r0.yml'
  pull_request:
    paths:
      - 'examples/colensmedia/**'
      - 'examples/comail_r0/**'
      - 'docs/Architecture/COFREE_EVOLVING_PUBLICATION_COMMONS_R0_20261026.md'
      - 'docs/Architecture/COPUBLICATION_FEDERATION_RECEIVER_INTEREST_R0_20261025.md'
      - 'docs/Architecture/CORELATIONSHIP_BRAID_FABRIC_R0_20261026.md'
      - 'examples/covisual_finder_r1/sources.json'
      - 'docs/Architecture/COLIVING_HIGHLIGHT_R0.md'
      - 'docs/Architecture/COMAP_COORB_COAHEAD_TEMPORAL_R0A_20261023.md'
      - 'docs/Architecture/CORELATIONAL_UX_PREDICTIVE_INPUT_R0.md'
      - 'docs/CoTheoryAll/costrawbe-r0/README.md'
      - '.github/workflows/co-living-media-r0.yml'
  schedule:
    - cron: '37 10 * * *'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: colens-living-media-r0-${{ github.ref }}
  cancel-in-progress: true
jobs:
  evidence-only:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
      - name: Verify source-backed browser view and pinned public donors
        run: python3 -B examples/colensmedia/build.py --check --check-donors
      - name: Check CoVisual source-to-CoLens one-object bridge
        run: python3 -B examples/colensmedia/visual_prior_bridge.py --check
      - name: Positive and fail-closed negative regressions
        run: python3 -B -m unittest discover -s examples/colensmedia/tests -p 'test_*.py' -v
      - name: Generate machine evidence receipt, not promotion
        shell: bash
        run: |
          python3 - <<'PY'
          import hashlib, json, os, pathlib
          root=pathlib.Path('examples/colensmedia')
          obj=json.loads((root/'manifest.json').read_text())
          sha=hashlib.sha256((root/'index.html').read_bytes()).hexdigest()
          rec={'schema':'CoAll.BenchmarkEvo.CoLensMedia.R0','status':'PASS','test':'exact_source_lenses_and_donors',
               'work_id':obj['work_id'],'html_sha256':sha,'runner':'GITHUB_ACTIONS_READ_ONLY',
               'source_blob_pinning':'PASS','video_production':'NOT_CLAIMED','hardware':'NOT_TESTED',
               'independent_receiver_ack':False,'nonclaims':obj['nonclaims']}
          dest=pathlib.Path(os.environ['RUNNER_TEMP'])/'benchmark_evo.jsonl'
          dest.write_text(json.dumps(rec,sort_keys=True)+'\n')
          print('CI_EVENT',rec['status'],rec['work_id'],sha)
          PY
      - name: Check CoMail fixed invitation and living-resource policy
        shell: bash
        run: |
          set -euo pipefail
          python3 -B examples/comail_r0/build.py --check --check-donors
          python3 -B -m unittest discover -s examples/comail_r0/tests -p 'test_*.py' -v
          python3 - <<'PY'
          import hashlib, json, os, pathlib
          root=pathlib.Path('examples/comail_r0')
          item=json.loads((root/'receipt.json').read_text())
          assert item['status']=='PASS_BOUNDED_SYNTHETIC_R0'
          assert item['actual_sends']==0 and item['actual_subscribers']==0
          assert not (root/'fixture.json').read_text().find('NO_EMAIL_SENT') == -1
          rec={'schema':'CoCivium.CoMail.BenchmarkEvo.R0','status':'PASS','test':'fixed_history_source_hash_donors_and_no_effect',
               'scope':'SYNTHETIC_OFFLINE_ONLY','html_sha256':hashlib.sha256((root/'index.html').read_bytes()).hexdigest(),
               'source_donor_count':len(item['source_contracts']),'actual_emails_sent':0,'actual_subscribers':0,
               'payment_runtime':'NOT_CONFIGURED','recipient_ack':False,'actual_public_host':False}
          out=pathlib.Path(os.environ['RUNNER_TEMP'])/'benchmark_evo.jsonl'
          with out.open('a',encoding='utf-8') as f:f.write(json.dumps(rec,sort_keys=True)+'\n')
          print('CI_COMAIL_R0',rec['status'],rec['html_sha256'])
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: colens-living-media-r0-${{ github.run_id }}
          path: ${{ runner.temp }}/benchmark_evo.jsonl
          if-no-files-found: error
          retention-days: 7
