name: CoProvider Exit Resilience R0

on:
  pull_request:
    paths:
      - "docs/Architecture/COPROVIDER_EXIT_RESILIENCE_R0.md"
      - "docs/Architecture/COMUTUAL_AID_GAME_R0.md"
      - "docs/Architecture/COEXIT_RIGHTS_DATA_ERASURE_R0.md"
      - "docs/Architecture/CODEPENDENCY_CENSUS_TRIPLE_LOSS_R0.md"
      - "docs/Architecture/CORECOVERY_KERNEL_R0.md"
      - "docs/Architecture/COACCOUNT_RETIREMENT_GATE_R0.md"
      - "docs/Architecture/COEXIT_GATE_PLANNER_R0.md"
      - "docs/Architecture/COEXIT_CONVERGENCE_HOLD_R0.md"
      - "fixtures/resilience/coprovexit_mutualaid_r0.json"
      - "fixtures/resilience/coexit_rights_data_erasure_r0.json"
      - "fixtures/resilience/codependency_census_triple_loss_r0.json"
      - "fixtures/resilience/corecovery_kernel_r0.json"
      - "fixtures/resilience/coaccount_retirement_gate_r0.json"
      - "fixtures/resilience/coexit_gate_planner_r0.json"
      - "fixtures/resilience/coexit_convergence_hold_r0.json"
      - "tools/validate_coprovexit_mutualaid_r0.py"
      - "tools/validate_coexit_rights_data_erasure_r0.py"
      - "tools/validate_codependency_census_triple_loss_r0.py"
      - "tools/validate_corecovery_kernel_r0.py"
      - "tools/validate_coaccount_retirement_gate_r0.py"
      - "tools/validate_coexit_gate_planner_r0.py"
      - "tools/validate_coexit_convergence_hold_r0.py"
      - ".github/workflows/coprovexit-resilience-r0.yml"
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out exact candidate head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python tools/validate_coprovexit_mutualaid_r0.py
      - run: python tools/validate_coexit_rights_data_erasure_r0.py
      - run: python tools/validate_codependency_census_triple_loss_r0.py
      - run: python tools/validate_corecovery_kernel_r0.py
      - run: python tools/validate_coaccount_retirement_gate_r0.py
      - run: python tools/validate_coexit_gate_planner_r0.py
      - name: Validate provider-exit convergence and productive HOLD
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python tools/validate_coexit_convergence_hold_r0.py --output artifacts/coexit-convergence-hold-r0.json
      - name: Upload convergence readproof
        uses: actions/upload-artifact@v4
        with:
          name: coexit-convergence-hold-r0
          path: artifacts/coexit-convergence-hold-r0.json
          if-no-files-found: error
          retention-days: 30
