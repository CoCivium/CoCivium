name: CoRegenerative R0 bounded feedback challenge
on:
  push:
    branches:
      - research/coregenerative-feedback-r0-20261026
  pull_request:
    paths:
      - 'experiments/coregenerative-r0/**'
      - '.github/workflows/coregenerative-r0.yml'
permissions:
  contents: read
jobs:
  reproducibility:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run deterministic and adversarial tests
        working-directory: experiments/coregenerative-r0
        run: |
          python -m unittest discover -s tests -v
          python verify_package.py
          python build.py
          python verify_package.py
      - name: Confirm output reproducibility
        run: git diff --exit-code -- experiments/coregenerative-r0
