name: Model substrate-light embodiment election R0

on:
  pull_request:
    paths:
      - "docs/Architecture/COMODEL_SUBSTRATE_LIGHT_EMBODIMENT_ELECTION_R0.md"
      - "fixtures/substrate/model_substrate_light_embodiment_election_r0.json"
      - "tools/validate_model_substrate_light_embodiment_election_r0.py"
      - ".github/workflows/model-substrate-light-embodiment-election-r0.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out exact candidate head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 1

      - name: Use Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Validate substrate-light embodiment election
        run: python tools/validate_model_substrate_light_embodiment_election_r0.py
