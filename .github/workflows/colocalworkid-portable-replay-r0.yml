name: CoLocalWorkID portable synthetic replay R0
permissions:
  contents: read

on:
  pull_request:
    paths:
      - 'examples/colocalworkid/**'
      - 'examples/cotalkitout/due_work_catchup_r0.py'
      - '.github/workflows/colocalworkid-portable-replay-r0.yml'
  push:
    paths:
      - 'examples/colocalworkid/**'
      - 'examples/cotalkitout/due_work_catchup_r0.py'
      - '.github/workflows/colocalworkid-portable-replay-r0.yml'

jobs:
  clean-runner-synthetic-replay:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run synthetic capsule cold replay and fail-closed tests
        run: python -B examples/colocalworkid/test_portable_replay_r0.py -v
