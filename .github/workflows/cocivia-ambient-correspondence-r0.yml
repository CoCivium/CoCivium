name: CoCivia Ambient Correspondence R0

on:
  pull_request:
    paths:
      - "docs/Comms/COCIVIA_AMBIENT_CORRESPONDENCE_R0.md"
      - "fixtures/cocivia/co_cocivia_ambient_correspondence_r0.json"
      - "tools/validate_cocivia_ambient_correspondence_r0.py"
      - ".github/workflows/cocivia-ambient-correspondence-r0.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python tools/validate_cocivia_ambient_correspondence_r0.py
