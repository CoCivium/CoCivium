name: CoCivia Ambient Correspondence R0

on:
  pull_request:
    paths:
      - "docs/Comms/COCIVIA_AMBIENT_CORRESPONDENCE_R0.md"
      - "docs/Comms/COALL_OPTIN_RESOURCE_FIELD_R0.md"
      - "docs/Comms/COALL_RESOURCE_FIELD_AGGREGATION_R0.md"
      - "docs/Comms/COALL_RESOURCE_RELIABILITY_R0.md"
      - "docs/Comms/COALL_RESOURCE_LEASE_REVOCATION_R0.md"
      - "docs/Comms/COALL_INFLIGHT_REVOCATION_R0.md"
      - "fixtures/cocivia/co_cocivia_ambient_correspondence_r0.json"
      - "fixtures/cocivia/coall_optin_resource_field_r0.json"
      - "fixtures/cocivia/coall_resource_field_aggregation_r0.json"
      - "fixtures/cocivia/coall_resource_reliability_r0.json"
      - "fixtures/cocivia/coall_resource_lease_revocation_r0.json"
      - "fixtures/cocivia/coall_inflight_revocation_r0.json"
      - "tools/validate_cocivia_ambient_correspondence_r0.py"
      - "tools/validate_coall_optin_resource_field_r0.py"
      - "tools/validate_coall_resource_field_aggregation_r0.py"
      - "tools/validate_coall_resource_reliability_r0.py"
      - "tools/validate_coall_resource_lease_revocation_r0.py"
      - "tools/validate_coall_inflight_revocation_r0.py"
      - ".github/workflows/cocivia-ambient-correspondence-r0.yml"
      - "identities/cocivia.json"
      - "docs/Identity/COFRONT_COCIVIA_GITHUB_R0.md"
      - "docs/Identity/COFRONT_GITHUB_SERVICE_PRINCIPAL_R1.md"
      - "docs/Identity/fixtures/cocivia-github-app-r1.json"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out exact candidate head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python tools/validate_cocivia_ambient_correspondence_r0.py
      - run: python tools/validate_coall_optin_resource_field_r0.py
      - run: python tools/validate_coall_resource_field_aggregation_r0.py
      - run: python tools/validate_coall_resource_reliability_r0.py
      - run: python tools/validate_coall_resource_lease_revocation_r0.py
      - run: python tools/validate_coall_inflight_revocation_r0.py
