name: CoCivia Ambient Correspondence R0

on:
  pull_request:
    paths:
      - "docs/Comms/COCIVIA_AMBIENT_CORRESPONDENCE_R0.md"
      - "docs/Comms/COALL_OPTIN_RESOURCE_FIELD_R0.md"
      - "docs/Comms/COALL_RESOURCE_FIELD_AGGREGATION_R0.md"
      - "docs/Comms/COALL_RESOURCE_RELIABILITY_R0.md"
      - "docs/Comms/COALL_RESOURCE_LEASE_REVOCATION_R0.md"
      - "docs/Comms/COALL_INFLIGHT_REVOCATION_R0.md"
      - "docs/Comms/COALL_DISTRIBUTED_LEASE_CONTENTION_R0.md"
      - "docs/Comms/COALL_RESOURCE_FAILOVER_RESUME_R0.md"
      - "docs/Comms/COALL_RESOURCE_COMPOSITION_R0.md"
      - "docs/Comms/COALL_RESOURCE_FIELD_COMPACTION_R0.md"
      - "docs/Comms/COALL_RESOURCE_ACTIVATION_METABOLISM_R0.md"
      - "fixtures/cocivia/co_cocivia_ambient_correspondence_r0.json"
      - "fixtures/cocivia/coall_optin_resource_field_r0.json"
      - "fixtures/cocivia/coall_resource_field_aggregation_r0.json"
      - "fixtures/cocivia/coall_resource_reliability_r0.json"
      - "fixtures/cocivia/coall_resource_lease_revocation_r0.json"
      - "fixtures/cocivia/coall_inflight_revocation_r0.json"
      - "fixtures/cocivia/coall_distributed_lease_contention_r0.json"
      - "fixtures/cocivia/coall_resource_failover_resume_r0.json"
      - "fixtures/cocivia/coall_resource_composition_r0.json"
      - "fixtures/cocivia/coall_resource_field_compaction_r0.json"
      - "fixtures/cocivia/coall_resource_activation_metabolism_r0.json"
      - "tools/validate_cocivia_ambient_correspondence_r0.py"
      - "tools/validate_coall_optin_resource_field_r0.py"
      - "tools/validate_coall_resource_field_aggregation_r0.py"
      - "tools/validate_coall_resource_reliability_r0.py"
      - "tools/validate_coall_resource_lease_revocation_r0.py"
      - "tools/validate_coall_inflight_revocation_r0.py"
      - "tools/validate_coall_distributed_lease_contention_r0.py"
      - "tools/validate_coall_resource_failover_resume_r0.py"
      - "tools/validate_coall_resource_composition_r0.py"
      - "tools/validate_coall_resource_field_compaction_r0.py"
      - "tools/validate_coall_resource_activation_metabolism_r0.py"
      - "docs/Comms/COALL_RESOURCE_CONVERGENCE_MAP_R0.md"
      - "fixtures/cocivia/coall_resource_convergence_map_r0.json"
      - "tools/validate_coall_resource_convergence_map_r0.py"
      - "docs/Comms/COALL_RESOURCE_CONVERGENCE_CHALLENGE_R0.md"
      - "fixtures/cocivia/coall_resource_convergence_challenge_r0.json"
      - "tools/validate_coall_resource_convergence_challenge_r0.py"
      - "docs/Comms/COALL_RESOURCE_CONVERGENCE_PROJECTION_R0.md"
      - "docs/Comms/COCIVIUM_RESOURCE_OBSERVER_PROJECTION_R0.md"
      - "schemas/co-resource-grant-r0.schema.json"
      - "schemas/co-resource-lease-r0.schema.json"
      - "fixtures/cocivia/coall_resource_grant_lease_receiver_canary_r0.json"
      - "tools/validate_coall_resource_grant_lease_receiver_r0.py"
      - "tools/compile_cocivium_resource_observer_projection_r0.py"
      - "fixtures/cocivia/coall_resource_convergence_projection_r0.json"
      - "tools/validate_coall_resource_convergence_projection_r0.py"
      - ".github/workflows/cocivia-ambient-correspondence-r0.yml"
      - "identities/cocivia.json"
      - "docs/Identity/COFRONT_COCIVIA_GITHUB_R0.md"
      - "docs/Identity/COFRONT_GITHUB_SERVICE_PRINCIPAL_R1.md"
      - "docs/Identity/fixtures/cocivia-github-app-r1.json"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out exact candidate head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python tools/validate_cocivia_ambient_correspondence_r0.py
      - run: python tools/validate_coall_optin_resource_field_r0.py
      - run: python tools/validate_coall_resource_field_aggregation_r0.py
      - run: python tools/validate_coall_resource_reliability_r0.py
      - run: python tools/validate_coall_resource_lease_revocation_r0.py
      - run: python tools/validate_coall_inflight_revocation_r0.py
      - run: python tools/validate_coall_distributed_lease_contention_r0.py
      - run: python tools/validate_coall_resource_failover_resume_r0.py
      - run: python tools/validate_coall_resource_composition_r0.py
      - run: python tools/validate_coall_resource_field_compaction_r0.py
      - run: python tools/validate_coall_resource_activation_metabolism_r0.py
      - run: python tools/validate_coall_resource_convergence_map_r0.py
      - run: python tools/validate_coall_resource_convergence_challenge_r0.py
      - run: python tools/validate_coall_resource_convergence_projection_r0.py
      - name: Produce exact-object resource-interface receiver readproof
        run: python tools/validate_coall_resource_grant_lease_receiver_r0.py --output artifacts/resource-interface-receiver-readproof-r0.json
      - name: Upload resource-interface receiver readproof
        uses: actions/upload-artifact@v4
        with:
          name: coall-resource-interface-receiver-readproof-r0
          path: artifacts/resource-interface-receiver-readproof-r0.json
          if-no-files-found: error
          retention-days: 30


  observer-projection:
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - name: Check out exact candidate head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Download exact resource-interface receiver readproof
        uses: actions/download-artifact@v4
        with:
          name: coall-resource-interface-receiver-readproof-r0
          path: source-readproof
      - name: Compile CoCivium observer projection
        run: python tools/compile_cocivium_resource_observer_projection_r0.py --source-receipt source-readproof/resource-interface-receiver-readproof-r0.json --output artifacts/cocivium-resource-observer-projection-r0.json
      - name: Upload CoCivium observer projection
        uses: actions/upload-artifact@v4
        with:
          name: cocivium-resource-observer-projection-r0
          path: artifacts/cocivium-resource-observer-projection-r0.json
          if-no-files-found: error
          retention-days: 30
