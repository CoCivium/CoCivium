name: CoPolarGap published-source R0 verification
on:
  pull_request:
    paths:
      - 'examples/copolar-gap/**'
      - '.github/workflows/copolar-gap-published-r0.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  offline-toy-source:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Syntax check pinned published HTML model test
        run: node --check examples/copolar-gap/published_source.test.mjs
      - name: Run source and no-effect regression fixtures, no optics devices
        run: node --test --test-reporter=tap examples/copolar-gap/published_source.test.mjs
      - name: Mark physical and receiver gates held
        run: echo "Synthetic source-test only, not a browser, laser, DMT, ET or independent receiver result."
