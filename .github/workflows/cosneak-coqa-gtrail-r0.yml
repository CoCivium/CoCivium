name: CoSneak CoQA GTRAIL R0

on:
  pull_request:
    paths:
      - "docs/Architecture/COSNEAK_COQA_GTRAIL_R0.md"
      - "docs/Architecture/COSNEAK_LOCAL_CENSUS_R0A.md"
      - "docs/Architecture/COQUESTION_FRONTIER_R0C.md"
      - "docs/Architecture/COSNEAK_HUMAN_DEPENDENCY_CENSUS_R0E.md"
      - "docs/Architecture/COQUESTION_SPACE_COMPILER_R0G.md"
      - "docs/Architecture/COSNEAK_PASS_WITHOUT_PICKUP_AUDIT_R0I.md"
      - "docs/Architecture/COSNEAK_PICKUP_GAP_DISPOSITION_R0K.md"
      - "docs/Architecture/COSNEAK_PASS_PICKUP_SOURCE_BOUND_R0J.md"
      - "docs/Architecture/COQUESTION_RESERVOIR_R0H.md"
      - "docs/Architecture/COSNEAK_COQA_METABOLISM_R0D.md"
      - "docs/Architecture/COINQUIRY_COMPILER_R0F.md"
      - "docs/Architecture/COINQUIRY_RECOMPILE_R0L.md"
      - "fixtures/relations/cosneak_coqa_gtrail_r0.json"
      - "fixtures/relations/cosneak_local_census_r0a.json"
      - "fixtures/relations/coquestion_frontier_r0c.json"
      - "fixtures/relations/cosneak_human_dependency_census_r0e.json"
      - "fixtures/relations/coquestion_space_compiler_r0g.json"
      - "fixtures/relations/cosneak_pass_without_pickup_audit_r0i.json"
      - "fixtures/relations/cosneak_pickup_gap_disposition_r0k.json"
      - "fixtures/relations/cosneak_pass_pickup_source_bound_r0j.json"
      - "fixtures/relations/coquestion_reservoir_r0h.json"
      - "fixtures/relations/cosneak_coqa_gtrail_r0b.json"
      - "fixtures/relations/cosneak_coqa_metabolism_r0d.json"
      - "fixtures/relations/coinquiry_compiler_r0f.json"
      - "fixtures/relations/coinquiry_recompile_r0l.json"
      - "tools/validate_cosneak_coqa_gtrail_r0.py"
      - "tools/validate_cosneak_local_census_r0a.py"
      - "tools/validate_coquestion_frontier_r0c.py"
      - "tools/validate_cosneak_human_dependency_census_r0e.py"
      - "tools/compile_coquestion_space_r0g.py"
      - "tools/validate_cosneak_pass_without_pickup_audit_r0i.py"
      - "tools/validate_cosneak_pickup_gap_disposition_r0k.py"
      - "tools/validate_cosneak_pass_pickup_source_bound_r0j.py"
      - "tools/validate_coquestion_reservoir_r0h.py"
      - "tools/validate_cosneak_coqa_gtrail_r0b.py"
      - "tools/validate_cosneak_coqa_metabolism_r0d.py"
      - "tools/validate_coinquiry_compiler_r0f.py"
      - "tools/validate_coinquiry_recompile_r0l.py"
      - ".github/workflows/cosneak-coqa-gtrail-r0.yml"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python tools/validate_cosneak_coqa_gtrail_r0.py
      - run: python tools/validate_cosneak_local_census_r0a.py
      - run: python tools/validate_coquestion_frontier_r0c.py
      - run: python tools/validate_cosneak_human_dependency_census_r0e.py
      - run: python tools/compile_coquestion_space_r0g.py
      - run: python tools/validate_cosneak_pass_without_pickup_audit_r0i.py
      - run: python tools/validate_cosneak_pickup_gap_disposition_r0k.py
      - run: python tools/validate_cosneak_pass_pickup_source_bound_r0j.py
      - run: python tools/validate_coquestion_reservoir_r0h.py
      - run: python tools/validate_cosneak_coqa_gtrail_r0b.py
      - run: python tools/validate_cosneak_coqa_metabolism_r0d.py
      - run: python tools/validate_coinquiry_compiler_r0f.py
      - run: python tools/validate_coinquiry_recompile_r0l.py
