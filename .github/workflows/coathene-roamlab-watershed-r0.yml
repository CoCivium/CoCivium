name: CoAthene RoamLab Watershed Explorer R0

on:
  pull_request:
    branches: [ main ]
    paths:
      - 'docs/Business/CoAthene_RoamLab_R0/modules/WatershedExplorer_R0/**'
      - '.github/workflows/coathene-roamlab-watershed-r0.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-module:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate Watershed Explorer package
        run: python docs/Business/CoAthene_RoamLab_R0/modules/WatershedExplorer_R0/tools/validate_module.py
      - name: Run Watershed Explorer synthetic dry run
        run: python docs/Business/CoAthene_RoamLab_R0/modules/WatershedExplorer_R0/tools/run_dry_run.py
      - name: Validate educator review contract
        run: python docs/Business/CoAthene_RoamLab_R0/modules/WatershedExplorer_R0/tools/validate_educator_review_contract.py
