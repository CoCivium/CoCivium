name: CoMapCursor R0 offline projection
on:
  pull_request:
    paths:
      - "experiments/comap-cursor-r0/**"
      - ".github/workflows/comap-cursor-r0.yml"

permissions:
  contents: read

jobs:
  node-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Synthetic projection and caret acceptance tests
        run: node --test experiments/comap-cursor-r0/core.test.mjs
      - name: Strict mode no effects
        run: node --test --test-reporter=spec experiments/comap-cursor-r0/core.test.mjs
