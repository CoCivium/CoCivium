name: CoThumb R1 bounded capsule smoke
on:
  push:
    paths:
      - 'scripts/CoThumbCoCopyR1.ps1'
      - 'scripts/coforeground_launch_gate_r0.py'
      - 'scripts/test_coforeground_launch_gate_r0.py'
      - 'ai/coforeground_launch_manifest_r0.json'
      - '.github/workflows/cothumb-cocopy-r1.yml'
  pull_request:
    paths:
      - 'scripts/CoThumbCoCopyR1.ps1'
      - 'scripts/coforeground_launch_gate_r0.py'
      - 'scripts/test_coforeground_launch_gate_r0.py'
      - 'ai/coforeground_launch_manifest_r0.json'
      - '.github/workflows/cothumb-cocopy-r1.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  synthetic-windows:
    runs-on: windows-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - name: Foreground launch policy audit and adversarial cases
        shell: pwsh
        run: |
          python -B scripts/test_coforeground_launch_gate_r0.py -v
          if ($LASTEXITCODE -ne 0) { throw "Foreground audit tests failed" }
          python -B scripts/coforeground_launch_gate_r0.py --manifest ai/coforeground_launch_manifest_r0.json
          if ($LASTEXITCODE -ne 0) { throw "Foreground source policy not accepted" }
      - name: Bare launch fails before GUI or file mutation
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $testRoot = Join-Path $env:RUNNER_TEMP 'CoFarmBareLaunch'
          New-Item -ItemType Directory -Force -Path $testRoot | Out-Null
          $output = & pwsh -NoProfile -File ./scripts/CoThumbCoCopyR1.ps1 -CoFarmRoot $testRoot 2>&1 | Out-String
          if ($LASTEXITCODE -eq 0) { throw 'Bare launch unexpectedly succeeded' }
          if ($output -notmatch 'HELD_EXPLICIT_MODE_REQUIRED') { throw 'Missing explicit-mode hold' }
          if (Test-Path (Join-Path $testRoot 'CoThumbR1')) { throw 'Bare launch mutated CoFarm fixture' }
          Write-Output 'PASS_BARE_LAUNCH_HELD_NO_SIDE_EFFECTS'
          $global:LASTEXITCODE = 0
      - name: Self-test in disposable local CoFarm fixture
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $testRoot = Join-Path $env:RUNNER_TEMP 'CoFarm'
          New-Item -ItemType Directory -Force -Path $testRoot | Out-Null
          $output = & pwsh -NoProfile -File ./scripts/CoThumbCoCopyR1.ps1 -Mode SelfTest -CoFarmRoot $testRoot
          if ($LASTEXITCODE -ne 0) { throw "Selftest exit code: $LASTEXITCODE" }
          $last = $output | Select-Object -Last 1
          $result = $last | ConvertFrom-Json
          if ($result.state -ne 'PASS_SYNTHETIC_LOCAL' -or $result.mouse_binding -ne 'NOT_TESTED') { throw 'Synthetic self-test mismatch.' }
          if (-not (Test-Path -LiteralPath $result.receipt)) { throw 'Missing local receipt.' }
          $receipt = Get-Content -LiteralPath $result.receipt -Raw | ConvertFrom-Json
          if ($receipt.state -ne 'PASS_LOCAL' -or $receipt.source_pass_count -ne 1) { throw 'Invalid local source proof.' }
          Write-Output "PASS_COTHUMB_R1_SYNTHETIC_CAPSULE|$($result.run)|PROPOSED=$($result.proposals)"
