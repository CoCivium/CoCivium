name: CoTime advisory evidence R0

on:
  pull_request:
    paths:
      - 'docs/Architecture/COADVISORY_COTIME_EVIDENCE_R0.md'
      - 'schemas/cotime-advisory-evidence-v0.1.schema.json'
      - 'examples/advisory/**'
      - 'scripts/validate_cotime_advisory_evidence_r0.py'
      - '.github/workflows/cotime-advisory-evidence-r0.yml'
  push:
    paths:
      - 'schemas/cotime-advisory-evidence-v0.1.schema.json'
      - 'examples/advisory/**'
      - 'scripts/validate_cotime_advisory_evidence_r0.py'

permissions:
  contents: read

jobs:
  bounded-matrix:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        fixture:
          - examples/advisory/public-observation-research.json
          - examples/advisory/public-prediction-private-discussion.json
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Parse fixture
        run: python -m json.tool "${{ matrix.fixture }}" >/dev/null
      - name: Validate advisory evidence rails
        run: python scripts/validate_cotime_advisory_evidence_r0.py "${{ matrix.fixture }}"

  bounded-fanin:
    needs: bounded-matrix
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Emit bounded receipt
        shell: bash
        run: |
          python - <<'PY'
          import hashlib, json
          from pathlib import Path
          paths=[
            Path("schemas/cotime-advisory-evidence-v0.1.schema.json"),
            Path("scripts/validate_cotime_advisory_evidence_r0.py"),
            Path("examples/advisory/public-observation-research.json"),
            Path("examples/advisory/public-prediction-private-discussion.json"),
          ]
          rows=[]
          for p in paths:
            b=p.read_bytes()
            rows.append({"path":str(p),"sha256":hashlib.sha256(b).hexdigest(),"bytes":len(b)})
          print(json.dumps({
            "state":"PASS_BOUNDED_PARALLEL_COTIME_ADVISORY_CI",
            "objects":rows,
            "rails":[
              "PREDICTION_NE_EVIDENCE",
              "PARALLEL_RESEARCH_NE_PARALLEL_AUTHORITY",
              "CI_PASS_NE_INVESTMENT_MERIT"
            ]
          },indent=2,sort_keys=True))
          PY
