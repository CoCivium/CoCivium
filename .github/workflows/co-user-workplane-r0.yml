name: CoUser Workplane R0

on:
  pull_request:
    paths:
      - "docs/UX/COUSER_WORKPLANE_R0.md"
      - "fixtures/ux/co_user_workplane_r0.json"
      - "tools/validate_co_user_workplane_r0.py"
      - ".github/workflows/co-user-workplane-r0.yml"
      - "docs/Architecture/COVIRTUAL_SESSION_MORPHOLOGY_R0.md"
      - "docs/UX/COFLEET_RICKBAR_R4.md"
      - "ai/session-lifecycle-policy.json"
      - "SESSION_BOOTSTRAP.md"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out exact candidate head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python tools/validate_co_user_workplane_r0.py
