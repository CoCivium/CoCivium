name: CoAuthority Field R0

on:
  pull_request:
    paths:
      - "docs/Architecture/COAUTHORITY_FIELD_R0.md"
      - "fixtures/governance/coauthority_field_r0.json"
      - "tools/validate_coauthority_field_r0.py"
      - ".github/workflows/coauthority-field-r0.yml"
      - "docs/Identity/COFRONT_GITHUB_SERVICE_PRINCIPAL_R1.md"
      - "docs/coterms/README.md"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out exact candidate head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python tools/validate_coauthority_field_r0.py
