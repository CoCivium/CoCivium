name: CoPreGeneric public draft asset pack R0
on:
  pull_request:
    paths:
      - "docs/Onramp/CoPreGenericR0/**"
      - "scripts/test_copre_public_asset_pack_r0.py"
      - ".github/workflows/copre-public-asset-pack-r0.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  source-pack:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate public manifest and privacy boundaries
        run: python -B -m unittest -v scripts/test_copre_public_asset_pack_r0.py
