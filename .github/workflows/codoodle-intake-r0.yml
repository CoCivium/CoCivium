name: CoDoodle intake R0 offline regression
on:
  pull_request:
    paths:
      - 'experiments/codoodle-intake-r0/**'
      - '.github/workflows/codoodle-intake-r0.yml'
permissions:
  contents: read
jobs:
  bounded-preview:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Run opt-in zero-effect tests
        run: python3 -B -m unittest discover -s experiments/codoodle-intake-r0 -p 'test_codoodle.py' -v
      - name: Check read-only synthetic output
        run: |
          python3 experiments/codoodle-intake-r0/codoodle.py --input experiments/codoodle-intake-r0/fixture.json > "$RUNNER_TEMP/codoodle.json"
          python3 - "$RUNNER_TEMP/codoodle.json" <<'PY'
          import json,sys
          p=json.load(open(sys.argv[1]))
          assert p['state']=='CANDIDATE_PREVIEW_ONLY'
          assert len(p['candidates'])==7
          assert all(v==0 for v in p['effects'].values())
          assert all(c['authority']=='NONE' for c in p['candidates'])
          assert 'raw_doodle' not in p
          print('PASS_OPT_IN_SHADOW_ONLY')
          PY
