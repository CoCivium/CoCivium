name: CoNod CoThumb shadow R0
on:
  pull_request:
    paths:
      - 'examples/conodcothumb/**'
      - '.github/workflows/conod-cothumb-shadow-r0.yml'
  push:
    paths:
      - 'examples/conodcothumb/**'
      - '.github/workflows/conod-cothumb-shadow-r0.yml'
permissions:
  contents: read
jobs:
  no_effect_policy_tests:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate CoNod shadow policy (never remap device or call provider)
        run: node examples/conodcothumb/CoNodCoThumbPolicyR0.mjs --selftest
      - name: Test CoB two-trigger synthetic invocation (zero external effects)
        run: node --test examples/conodcothumb/context_rail_r1/event_invocation_r0/test_event_invocation.cjs
      - name: Test CoB durable synthetic claim under crashes and process concurrency
        run: node --test examples/conodcothumb/context_rail_r1/event_invocation_r0/test_durable_claim.cjs
