name: CoNod qualified CoPre read-only resolver R1
on:
  push:
    branches:
      - candidate/conod-qualified-copre-rebind-r1-20261120
    paths:
      - examples/conodcothumb/conod_qualified_copre_r1.mjs
      - examples/conodcothumb/test_conod_qualified_copre_r1.mjs
      - .github/workflows/conod-qualified-copre-r1.yml
  pull_request:
    paths:
      - examples/conodcothumb/conod_qualified_copre_r1.mjs
      - examples/conodcothumb/test_conod_qualified_copre_r1.mjs
      - .github/workflows/conod-qualified-copre-r1.yml
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: conod-qualified-r1-${{ github.ref }}
  cancel-in-progress: true
jobs:
  shadow-resolver:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: 26 source-only gesture/currentness/fail-closed checks
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p proof/conod-qualified-r1
          node --check examples/conodcothumb/conod_qualified_copre_r1.mjs
          node --check examples/conodcothumb/test_conod_qualified_copre_r1.mjs
          node examples/conodcothumb/test_conod_qualified_copre_r1.mjs | tee proof/conod-qualified-r1/tests.log
          grep -F 'CONOD_QUALIFIED_SHADOW_PASS 26 tests | execution=0 | receiver_ack=false' proof/conod-qualified-r1/tests.log
          git rev-parse HEAD > proof/conod-qualified-r1/revision.txt
          sha256sum examples/conodcothumb/conod_qualified_copre_r1.mjs examples/conodcothumb/test_conod_qualified_copre_r1.mjs > proof/conod-qualified-r1/source-sha256.txt
          printf '%s\n' 'SOURCE_ONLY; NO RUNTIME; NO CoNode OPT-IN; NO PROVIDER CHAT ACTION; NO SCHEDULE; NO RECEIVER ACK; NO CANON' > proof/conod-qualified-r1/nonclaims.txt
      - name: Retain source-scoped receipt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: conod-qualified-source-${{ github.run_id }}
          path: proof/conod-qualified-r1/
          if-no-files-found: warn
          retention-days: 30
