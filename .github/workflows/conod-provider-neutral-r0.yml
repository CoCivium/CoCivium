name: CoNod provider-neutral bounded canary

on:
  pull_request:
    paths:
      - "ai/conod-dynamic-wave-r2.json"
      - "ai/coavnim-cognitive-aura-r0.json"
      - "ai/fixtures/conod-coaura-synthetic-r0.json"
      - "ai/fixtures/conod-provider-neutral-failover-r0.json"
      - "scripts/CoNodProviderNeutralCanaryR0.py"
      - ".github/workflows/conod-provider-neutral-r0.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  bounded-canary:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate CoNod provider-neutral invariants
        run: python scripts/CoNodProviderNeutralCanaryR0.py
