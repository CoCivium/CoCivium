name: CoStretch benchmark evidence R0
on:
  pull_request:
    paths:
      - 'scripts/validate_benchmark_evo_r0.py'
      - 'tests/test_benchmark_evo_r0.py'
      - 'benchmarks/costretch/**'
      - '.github/workflows/costretch-benchmark-evo-r0.yml'
permissions:
  contents: read
jobs:
  offline-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Test fail-closed synthetic benchmark validation
        run: python3 -B -m unittest discover -s tests -p 'test_benchmark_evo_r0.py' -v
      - name: Validate sample and show PASS FAIL HOLD counts
        run: python3 -B scripts/validate_benchmark_evo_r0.py benchmarks/costretch/benchmark_evo.jsonl
