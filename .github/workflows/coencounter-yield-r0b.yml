name: Validate CoEncounterYield R0B

on:
  pull_request:
    paths:
      - "ai/coencounter-open-relation-routing-r0.json"
      - "ai/evolution-deltas/2026-09-24/coparticipation-ecology-r0b-independent-review-routing.json"
      - "docs/Operations/COENCOUNTER_YIELD_R0B.md"
      - "docs/Operations/fixtures/coencounter-yield-r0a-multireceiver.json"
      - "docs/Operations/proofs/coencounter-yield-r0a-container-pass-20260924.json"
      - "schemas/coencounter-yield-v0.1.schema.json"
      - "scripts/CoEncounterYieldIndependentReviewR0B.py"
      - ".github/workflows/coencounter-yield-r0b.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  independent-review:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Use Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install JSON Schema validator
        run: python -m pip install --disable-pip-version-check jsonschema==4.23.0
      - name: Validate exact R0A encounters against CoEncounterYield schema
        shell: python
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          from jsonschema import Draft202012Validator

          schema_path = Path("schemas/coencounter-yield-v0.1.schema.json")
          fixture_path = Path("docs/Operations/fixtures/coencounter-yield-r0a-multireceiver.json")

          schema = json.loads(schema_path.read_text(encoding="utf-8"))
          pack = json.loads(fixture_path.read_text(encoding="utf-8"))
          Draft202012Validator.check_schema(schema)
          validator = Draft202012Validator(schema)

          encounters = pack.get("encounters")
          if not isinstance(encounters, list) or not encounters:
              raise SystemExit("FAIL_CLOSED__NO_ENCOUNTERS_FOR_SCHEMA_VALIDATION")

          errors = []
          for index, encounter in enumerate(encounters):
              for error in sorted(validator.iter_errors(encounter), key=lambda e: list(e.absolute_path)):
                  path = ".".join(str(x) for x in error.absolute_path)
                  errors.append({
                      "encounter_index": index,
                      "path": path,
                      "message": error.message,
                  })

          if errors:
              print(json.dumps({"STATE":"FAIL_SCHEMA_VALIDATION","errors":errors}, indent=2))
              raise SystemExit(1)

          print(json.dumps({
              "STATE":"PASS_EXACT_R0A_ENCOUNTERS_MATCH_COENCOUNTER_YIELD_V0_1_SCHEMA",
              "encounters_validated":len(encounters),
              "schema":"schemas/coencounter-yield-v0.1.schema.json",
              "fixture":"docs/Operations/fixtures/coencounter-yield-r0a-multireceiver.json"
          }, separators=(",",":")))
          PY
      - name: Run independent deterministic review
        run: |
          rm -f /tmp/coencounter-yield-r0b-result.json
          python scripts/CoEncounterYieldIndependentReviewR0B.py \
            --fixture docs/Operations/fixtures/coencounter-yield-r0a-multireceiver.json \
            --source-proof docs/Operations/proofs/coencounter-yield-r0a-container-pass-20260924.json \
            --profiles ai/session-subscription-profiles.json \
            --policy ai/coencounter-open-relation-routing-r0.json \
            --output /tmp/coencounter-yield-r0b-result.json
          python - <<'PY'
          import json
          from pathlib import Path
          p=Path('/tmp/coencounter-yield-r0b-result.json')
          d=json.loads(p.read_text())
          assert d['state'].startswith('PASS_R0B_')
          assert d['effects']['assignments'] == 0
          assert d['effects']['deliveries'] == 0
          assert d['effects']['participant_notifications'] == 0
          assert len(d['routing']['route_candidates']) == 1
          print(json.dumps({
            'STATE':d['state'],
            'ROUTE_CANDIDATES':len(d['routing']['route_candidates']),
            'CANDIDATE_RECEIVERS':d['routing']['route_candidates'][0]['candidate_receivers'],
            'NEGATIVE_TESTS':d['negative_tests'],
            'NEXT':d['next']
          }, separators=(',',':')))
          PY
