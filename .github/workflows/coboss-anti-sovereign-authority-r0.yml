name: CoBoss Anti-Sovereign Authority R0

on:
  pull_request:
    paths:
      - "docs/Architecture/COBOSS_ANTI_SOVEREIGN_AUTHORITY_R0.md"
      - "fixtures/authority/coboss_authority_relations_r0.json"
      - "tools/validate_coboss_authority_relations_r0.py"
      - ".github/workflows/coboss-anti-sovereign-authority-r0.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python tools/validate_coboss_authority_relations_r0.py
