name: CoLoop safety regressions

on:
  push:
    paths:
      - 'tests/gs_loop/**'
      - 'tests/gs_receiver/**'
      - '.github/workflows/coloops-safety.yml'
  pull_request:
    paths:
      - 'tests/gs_loop/**'
      - 'tests/gs_receiver/**'
      - '.github/workflows/coloops-safety.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  isolated-safety:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run isolated safety regressions
        run: python -m unittest discover -s tests/gs_loop -p 'test_*.py' -v && python -m unittest discover -s tests/gs_receiver -p 'test_*.py' -v
