name: CoFrontier Intake R0

on:
  pull_request:
    paths:
      - "docs/Architecture/COFRONTIER_INTAKE_R0.md"
      - "docs/Architecture/COFRONTIER_QWEN3_0_6B_PROVENANCE_R0.md"
      - "fixtures/evolution/cofrontier_intake_r0.json"
      - "fixtures/evolution/cofrontier_qwen3_0_6b_provenance_r0.json"
      - "tools/validate_cofrontier_intake_r0.py"
      - "tools/validate_cofrontier_qwen3_0_6b_provenance_r0.py"
      - ".github/workflows/cofrontier-intake-r0.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out exact candidate head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 1
      - name: Use Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate frontier intake
        run: python tools/validate_cofrontier_intake_r0.py --output artifacts/cofrontier-intake-readproof-r0.json
      - name: Validate real pinned candidate provenance
        run: python tools/validate_cofrontier_qwen3_0_6b_provenance_r0.py --output artifacts/cofrontier-qwen3-0.6b-provenance-readproof-r0.json
      - name: Upload readproofs
        uses: actions/upload-artifact@v4
        with:
          name: cofrontier-intake-readproof-r0
          path: artifacts
          if-no-files-found: error
          retention-days: 30
