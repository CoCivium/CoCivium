name: CoGoldenBraid bounded evaluator
on:
  push:
    paths:
      - "examples/cogoldenbraid/**"
      - ".github/workflows/cogoldenbraid-bounded.yml"
  pull_request:
    paths:
      - "examples/cogoldenbraid/**"
      - ".github/workflows/cogoldenbraid-bounded.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  bounded:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run bounded braid checks
        run: python -B examples/cogoldenbraid/bounded_braid_r0.py -v
