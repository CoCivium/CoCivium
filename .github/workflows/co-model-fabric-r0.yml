name: CoModelFabric X2 read-only preflight

on:
  pull_request:
    paths:
      - "examples/comodelfabric_x2/**"
      - ".github/workflows/co-model-fabric-r0.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  static-source:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - name: Test no-effect boundaries
        run: python3 examples/comodelfabric_x2/test_static.py
  windows-powershell:
    runs-on: windows-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - name: Parse and execute self-test only
        shell: pwsh
        run: |
          $path = 'examples/comodelfabric_x2/Test-CoModelFabricX2R0.ps1'
          $tokens = $null
          $errors = $null
          $null = [System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path $path).Path,[ref]$tokens,[ref]$errors)
          if ($errors.Count -gt 0) { throw "PowerShell AST parse failed" }
          $result = & pwsh -NoProfile -File $path -Mode SelfTest | ConvertFrom-Json
          if ($LASTEXITCODE -ne 0 -or $result.status -ne 'PASS' -or $result.passed -ne 13 -or $result.total -ne 13) { throw "SelfTest failed" }
          $check = & pwsh -NoProfile -File $path -Mode Check -SkipOllama | ConvertFrom-Json
          if ($LASTEXITCODE -ne 0 -or $check.local_ollama.status -ne 'HELD_NOT_PROBED' -or $check.browser_claude.state -ne 'AUTH_UNKNOWN_NOT_PROBED') { throw "Read-only check failed" }
          Write-Output 'PASS_SELFTEST_13_OF_13_AND_NO_NETWORK_READONLY_CHECK'
