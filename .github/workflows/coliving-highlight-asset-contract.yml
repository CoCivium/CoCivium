name: CoLiving highlight asset contract

on:
  pull_request:
    paths:
      - 'docs/Architecture/COLIVING_HIGHLIGHT_ASSETS_R0.md'
      - 'schemas/coliving-highlight-asset-v0.1.schema.json'
      - 'examples/coliving-highlight-asset-v0.1.example.json'
      - '.github/workflows/coliving-highlight-asset-contract.yml'
  push:
    branches: [main]
    paths:
      - 'schemas/coliving-highlight-asset-v0.1.schema.json'
      - 'examples/coliving-highlight-asset-v0.1.example.json'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install validator
        run: python -m pip install --disable-pip-version-check jsonschema==4.23.0
      - name: Validate living highlight example
        shell: python
        run: |
          import json
          from pathlib import Path
          from jsonschema import Draft202012Validator
          schema = json.loads(Path("schemas/coliving-highlight-asset-v0.1.schema.json").read_text())
          example = json.loads(Path("examples/coliving-highlight-asset-v0.1.example.json").read_text())
          Draft202012Validator.check_schema(schema)
          errors = list(Draft202012Validator(schema).iter_errors(example))
          if errors:
              for e in errors:
                  print(list(e.path), e.message)
              raise SystemExit(1)
          print("PASS_COLIVING_HIGHLIGHT_ASSET_V0_1")
