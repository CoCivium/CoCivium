name: CoPre NEXT R0 bounded read-only tests

permissions:
  contents: read

on:
  pull_request:
    paths:
      - "scripts/CoPreContinuationR0.py"
      - "docs/Architecture/COPRE_NEXT_SELF_DIRECTION_PACK_R0_20261109.md"
      - "docs/Architecture/COEV_OPERATOR_FIELD_COPRE_COMPOSER_R0_20261109.md"
      - "docs/Architecture/COPRE_STICKY_INVARIANTS_RECOVERY_OPTIONS_R0_20261109.md"
      - "scripts/CoPreInvariantGuardR0.py"
      - "scripts/CoExWaveEndcapsR0.py"
      - "scripts/CoWaveOverlapGuardR0.py"
      - "scripts/CoStatusOffloadR0.py"
      - "docs/Architecture/COSTATUS_OFFLOAD_SHARED_HEAD_R0_20261109.md"
      - "docs/Operations/wave-renders/cooffload-20261109/BEGIN.md"
      - "docs/Operations/wave-renders/cooffload-20261109/END.md"
      - "ai/evolution/cooverlap-prior-meaning-r0.json"
      - "docs/Architecture/COWAVE_OVERLAP_COLOT_PRIOR_FABRIC_R0_20261109.md"
      - "docs/Operations/wave-renders/cooverlap-20261109/BEGIN.md"
      - "docs/Operations/wave-renders/cooverlap-20261109/END.md"
      - "docs/Architecture/COEX_WAVE_ENDCAP_LANDING_R0_20261109.md"
      - "docs/Operations/wave-renders/colot-endcaps-20261109/BEGIN.md"
      - "docs/Operations/wave-renders/colot-endcaps-20261109/END.md"
      - "ai/evolution/coev-operator-field-r0.json"
      - ".github/workflows/copre-next-r0.yml"
  push:
    paths:
      - "scripts/CoPreContinuationR0.py"
      - "scripts/CoWaveOverlapGuardR0.py"
      - "scripts/CoStatusOffloadR0.py"
      - "scripts/CoPreInvariantGuardR0.py"
      - ".github/workflows/copre-next-r0.yml"

jobs:
  copre:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Exercise exact-pack synthetic selftest
        run: python3 -B scripts/CoPreContinuationR0.py --selftest
      - name: Verify no-op, two-wave identity and stop boundary
        run: |
          python3 - <<'PY'
          import importlib.util
          import pathlib
          spec=importlib.util.spec_from_file_location("copre","scripts/CoPreContinuationR0.py")
          c=importlib.util.module_from_spec(spec)
          spec.loader.exec_module(c)
          assert c.SCHEMA=="CoCivium.CoPreContinuation.R0"
          assert "PUBLIC_OUTREACH" in c.FORBIDDEN
          assert c.compile_pack({"work_id":"partial"})["status"]=="HOLD"
          print("PASS_COPRE_READ_ONLY_CONTRACT_R0")
          PY

      - name: Verify CoEv registry and explicit input projection
        run: |
          python3 - <<'PY'
          import importlib.util
          import json
          p=json.load(open("ai/evolution/coev-operator-field-r0.json",encoding="utf-8"))
          assert p["schema"] == "CoCivium.CoEv.OperatorField.R0.v0.1"
          for key,expected in [("forces",10),("operator_families",10),("hyperrelations",4)]:
              assert len(p[key])==expected
              ids=[v["id"] for v in p[key]]
              assert len(ids)==len(set(ids))
          assert p["traversal"]["max_active_effect_writers"]==1
          assert p["traversal"]["max_depth"]<=3
          assert all(x["epistemic"] for x in p["forces"])
          assert any(x["id"]=="G_D_SIDE" and x["epistemic"]=="METAPHORICAL_OR_COUNTERFACTUAL" for x in p["forces"])
          spec=importlib.util.spec_from_file_location("copre","scripts/CoPreContinuationR0.py")
          mod=importlib.util.module_from_spec(spec)
          spec.loader.exec_module(mod)
          assert mod.render_continuation_input({"status":"HOLD"}) is None
          print("PASS_COEV_REGISTRY_AND_INPUT_PROJECTION_R0")
          PY
      - name: Test sticky session invariants, mirror optionality and fail-closed recovery
        run: python3 -B scripts/CoPreInvariantGuardR0.py --selftest

      - name: Validate CoEx endcap action boundary and real saved wave renders
        run: |
          python3 -B scripts/CoExWaveEndcapsR0.py --selftest
          python3 - <<'PY'
          import hashlib
          import importlib.util
          from pathlib import Path
          import subprocess

          spec=importlib.util.spec_from_file_location("endcap","scripts/CoExWaveEndcapsR0.py")
          m=importlib.util.module_from_spec(spec)
          spec.loader.exec_module(m)
          begin_path="docs/Operations/wave-renders/colot-endcaps-20261109/BEGIN.md"
          end_path="docs/Operations/wave-renders/colot-endcaps-20261109/END.md"
          a=Path(begin_path).read_text(encoding="utf-8")
          b=Path(end_path).read_text(encoding="utf-8")
          assert "Wave Render | BEGIN" in a
          assert "Wave Render | END" in b
          assert "CoLOT.Endcaps.20261109" in a and "CoLOT.Endcaps.20261109" in b
          assert "INTENT_RECORDED__NOT_WORK_RESULT" in a
          assert "SOURCE_LANDED__CI_PENDING_AT_RENDER_TIME" in b
          assert "Independent receiver ACK:" in b
          assert a != b
          ac=subprocess.check_output(["git","log","-1","--format=%H","--",begin_path],text=True).strip()
          bc=subprocess.check_output(["git","log","-1","--format=%H","--",end_path],text=True).strip()
          assert ac and bc and ac!=bc, "BEGIN_AND_END_NOT_SEPARATELY_LANDED"
          def cap(phase,raw,status):
              return {
                  "phase":phase, "work_id":"CoLOT.Endcaps.20261109", "wave_id":"R0",
                  "source_ref":"CoCivium/CoCivium#401",
                  "source_revision":subprocess.check_output(["git","rev-parse","HEAD"],text=True).strip(),
                  "render_kind":"MARKDOWN_SOURCE_RENDER",
                  "render_sha256":hashlib.sha256(raw.encode()).hexdigest(),
                  "effect_intent":"SCRIPT_LANDING", "surface":"GITHUB_DRAFT_SOURCE",
                  "target_ref":"research/copre-next-self-direction-r0-20261109",
                  "authority_scope":"PUBLIC_DRAFT_BRANCH_ONLY", "confidentiality":"PUBLIC",
                  "receipt_ref":"PR401:exact_git_file", "status":status,
                  "next_wake":"material source or receiver change",
                  "coex_claim":False, "landing_status":"PROPOSED"
              }
          ca=cap("BEGIN",a,"INTENT_RECORDED")
          cb=cap("END",b,"VERIFIED_SOURCE")
          cb["begin_render_sha256"]=ca["render_sha256"]
          result=m.review(ca,cb,a,b)
          assert result["status"]=="REVIEW_SOURCE_LANDING_ONLY",result
          assert result["separate_landing_records"]==2
          assert result["effects_performed"]==0
          assert result["coex"]=="NOT_CERTIFIED"
          print("PASS_SAVED_BEGIN_END_GIT_HISTORY_AND_READONLY_COEX_GATE_R0")
          print("BEGIN_COMMIT="+ac)
          print("END_COMMIT="+bc)
          print("BEGIN_SHA256="+ca["render_sha256"])
          print("END_SHA256="+cb["render_sha256"])
          PY

      - name: Test overlapping waves, term lineage and separately saved renders
        run: |
          python3 -B scripts/CoWaveOverlapGuardR0.py --selftest
          python3 - <<'PY'
          import hashlib
          import json
          from pathlib import Path
          import subprocess
          from importlib.util import spec_from_file_location, module_from_spec
          ix=json.loads(Path("ai/evolution/cooverlap-prior-meaning-r0.json").read_text())
          assert ix["schema"]=="CoCivium.CoOverlapPriorMeaning.R0.v0.1"
          assert len(ix["candidates"])==23
          assert len(ix["candidate_new_terms"])==5
          unresolved={v["term"] for v in ix["candidates"] if v["class"]=="UNRESOLVED"}
          assert not {"CSMR","CiCollectibles"} & unresolved
          meanings={v["term"]:v for v in ix["candidates"]}
          assert meanings["CSMR"]["meaning"].startswith("CoScendent Modulation Ratio")
          assert meanings["CoRiz+"]["source"]=="USER_DIRECT_2026-11-09"
          assert "children and gamers" in meanings["CoCollectibles+"]["meaning"].lower()
          bp="docs/Operations/wave-renders/cooverlap-20261109/BEGIN.md"
          ep="docs/Operations/wave-renders/cooverlap-20261109/END.md"
          a=Path(bp).read_text();b=Path(ep).read_text()
          assert "CoPre.Overlap.20261109" in a and "CoPre.Overlap.20261109" in b
          assert "INTENT_ONLY" in a and "CI_PENDING" in b
          ac=subprocess.check_output(["git","log","-1","--format=%H","--",bp],text=True).strip()
          ec=subprocess.check_output(["git","log","-1","--format=%H","--",ep],text=True).strip()
          assert ac and ec and ac!=ec
          spec=spec_from_file_location("coex","scripts/CoExWaveEndcapsR0.py")
          mod=module_from_spec(spec);spec.loader.exec_module(mod)
          def endcap(phase,body,status):
              return {"phase":phase,"work_id":"CoPre.Overlap.20261109","wave_id":"R0",
              "source_ref":"CoCivium/CoCivium#401","source_revision":"bound-git-source-in-repo",
              "render_kind":"MARKDOWN_SOURCE_RENDER","render_sha256":hashlib.sha256(body.encode()).hexdigest(),
              "effect_intent":"SCRIPT_LANDING","surface":"GITHUB_DRAFT_SOURCE",
              "target_ref":"research/copre-next-self-direction-r0-20261109",
              "authority_scope":"PUBLIC_DRAFT_BRANCH_ONLY","confidentiality":"PUBLIC",
              "receipt_ref":"PR401:read-only-CI","status":status,
              "next_wake":"material source or receiver change","coex_claim":False,"landing_status":"PROPOSED"}
          start=endcap("BEGIN",a,"INTENT_RECORDED")
          end=endcap("END",b,"VERIFIED_SOURCE")
          end["begin_render_sha256"]=start["render_sha256"]
          result=mod.review(start,end,a,b)
          assert result["status"]=="REVIEW_SOURCE_LANDING_ONLY",result
          assert result["effects_performed"]==0 and result["coex"]=="NOT_CERTIFIED"
          print("PASS_COOVERLAP_2_RENDER_COMMITS_AND_PRIOR_TERM_SCOPE_R0")
          print("BEGIN_COMMIT="+ac)
          print("END_COMMIT="+ec)
          print("BEGIN_SHA256="+start["render_sha256"])
          print("END_SHA256="+end["render_sha256"])
          PY
      - name: Validate portable off-session WorkID and staged merge; verify two source renders
        run: |
          python3 -B scripts/CoStatusOffloadR0.py --selftest
          python3 - <<'PY'
          import subprocess
          from pathlib import Path
          p="docs/Operations/wave-renders/cooffload-20261109/"
          begin=p+"BEGIN.md"
          end=p+"END.md"
          a=Path(begin).read_text(encoding="utf-8")
          b=Path(end).read_text(encoding="utf-8")
          assert "CoPre.Offshore.20261109" in a and "CoPre.Offshore.20261109" in b
          assert "INTENT_RECORDED_NOT_RESULT" in a and "SOURCE_LANDED_CI_PENDING" in b
          assert a!=b
          ac=subprocess.check_output(["git","log","-1","--format=%H","--",begin],text=True).strip()
          bc=subprocess.check_output(["git","log","-1","--format=%H","--",end],text=True).strip()
          assert ac and bc and ac!=bc
          print("PASS_COSTATUS_OFFLOAD_DISTINCT_BEGIN_END_SOURCE_COMMITS")
          print("BEGIN_COMMIT="+ac)
          print("END_COMMIT="+bc)
          PY
