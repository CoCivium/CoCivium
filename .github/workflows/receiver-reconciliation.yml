name: Receiver reconciliation regression
on:
  push:
    paths:
      - 'tests/gs_receiver/**'
      - '.github/workflows/receiver-reconciliation.yml'
  pull_request:
    paths:
      - 'tests/gs_receiver/**'
      - '.github/workflows/receiver-reconciliation.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  isolated-receiver:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Execute receiver fencing and replay regression
        run: python -m unittest discover -s tests/gs_receiver -p 'test_*.py' -v
