name: CoOrb membrane evidence projection CI
on:
  pull_request:
    paths:
      - 'examples/coorbmembrane_r0/**'
      - '.github/workflows/coorb-membrane-r0.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  membrane-canary:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate headless and accessible SVG projections
        run: node --test examples/coorbmembrane_r0/membrane.test.mjs
