name: CoPre Exact Source Reader R0

on:
  pull_request:
    paths:
      - 'scripts/CoPreSeedPathReaderR0.py'
      - 'tests/test_copre_seed_path_reader_r0.py'
      - '.github/workflows/copre-exact-source-reader-r0.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  offline-readproof-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check exact-source verification and negative controls
        run: python3 -B -m unittest discover -s tests -p 'test_copre_seed_path_reader_r0.py' -v
