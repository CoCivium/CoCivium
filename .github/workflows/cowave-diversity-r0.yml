name: CoWave diversity candidate tests
on:
  pull_request:
    paths:
      - 'examples/cowave_diversity_r0/**'
      - '.github/workflows/cowave-diversity-r0.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  source-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python3 -B -m unittest discover -s examples/cowave_diversity_r0 -p 'test_*.py' -v
