name: CoGoAll Evergreen Blast

permissions:
  contents: read

on:
  pull_request:
    paths:
      - "EVERGREEN.md"
      - "ai/benchmark-evo.jsonl"
      - "docs/publishing/cogoall-evergreen-receivers-r0.json"
      - "scripts/CoBenchmarkEvoCheckR0.py"
      - ".github/workflows/cogoall-evergreen-blast.yml"
  push:
    paths:
      - "EVERGREEN.md"
      - "ai/benchmark-evo.jsonl"
      - "docs/publishing/cogoall-evergreen-receivers-r0.json"
      - "scripts/CoBenchmarkEvoCheckR0.py"
      - ".github/workflows/cogoall-evergreen-blast.yml"

jobs:
  evergreen:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate benchmark evolution log
        run: python -B scripts/CoBenchmarkEvoCheckR0.py ai/benchmark-evo.jsonl
      - name: Validate evergreen and receiver boundaries
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          evergreen = Path("EVERGREEN.md").read_text(encoding="utf-8")
          required = [
              "Publish the best we have, never ready.",
              "FOSS Forever.",
              "Privacy by design.",
              "LOGICAL_SESSION_COUNT_NE_ACTIVE_PROCESS_COUNT",
              "SELECTED_NE_EXECUTED",
              "HIGH_UTILIZATION_NE_HIGH_VALUE",
              "HELD_NO_RECEIVER",
              "Pointer is not ACK. Receipt beats assertion.",
          ]
          for text in required:
              assert text in evergreen, text

          manifest = json.loads(
              Path("docs/publishing/cogoall-evergreen-receivers-r0.json").read_text()
          )
          requested = manifest["requested_channels"]
          for key in (".nodes", "nodes", ".sites", "sites"):
              assert requested[key]["status"] == "HELD_NO_RECEIVER"
          assert requested["github"]["status"] == "TARGET_VERIFIED"
          assert requested["gmail"]["status"] == "TARGETS_VERIFIED_FROM_EXISTING_THREADS"
          print("Evergreen receiver boundaries passed")
          PY
