name: CoMegaThesis R0 proof gates
on:
  push:
    branches:
      - "candidate/cotheoryall-comap-megathesis-ux-gdside-r0-20261120"
    paths:
      - "docs/CoTheoryAll/candidates/**"
      - "ai/cotheoryall/**"
      - "scripts/test_comegathesis_*"
      - "scripts/test_coworkid_process_replay_r0.cjs"
      - "scripts/test_coworkid_concurrent_fencing_r0.cjs"
      - "scripts/test_coci_artifact_readback_r0.cjs"
      - "scripts/render_coci_ci_status_r0.cjs"
      - "scripts/test_coci_session_residue_r0.cjs"
      - "ai/currentness/coci-session-*-r0-20261120.json"
      - ".github/workflows/comegathesis-r0.yml"
  pull_request:
    paths:
      - "docs/CoTheoryAll/candidates/**"
      - "ai/cotheoryall/**"
      - "scripts/test_comegathesis_*"
      - "scripts/test_coworkid_process_replay_r0.cjs"
      - "scripts/test_coworkid_concurrent_fencing_r0.cjs"
      - "scripts/test_coci_artifact_readback_r0.cjs"
      - "scripts/render_coci_ci_status_r0.cjs"
      - "scripts/test_coci_session_residue_r0.cjs"
      - "ai/currentness/coci-session-*-r0-20261120.json"
      - ".github/workflows/comegathesis-r0.yml"
  workflow_dispatch:
    inputs:
      run_browser:
        description: "Run an optional source-only Chromium smoke; not UX acceptance"
        type: boolean
        default: false
        required: false
concurrency:
  group: comegathesis-ci-${{ github.event.pull_request.head.ref || github.ref_name }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  source-parity:
    name: Source identity, epistemic rails and negative-control gates
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Run no-dependency source regression and emit hash-bound receipt
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts/comegathesis-r0
          node --check scripts/test_comegathesis_three_view_r0.cjs
          node scripts/test_comegathesis_three_view_r0.cjs | tee artifacts/comegathesis-r0/source-tests.log
          git rev-parse HEAD > artifacts/comegathesis-r0/revision.txt
          sha256sum \
            scripts/test_comegathesis_three_view_r0.cjs \
            ai/cotheoryall/comegathesis-relations-r0.json \
            ai/cotheoryall/comegathesis-mythos-federation-delta-r0.json \
            docs/CoTheoryAll/candidates/comegathesis-reader-r0.html \
            docs/CoTheoryAll/candidates/COMYTHOS_COSEEDUNIFY_COFED_COIGC_R0_20261120.md \
            > artifacts/comegathesis-r0/source-hashes.sha256
          printf '%s\n' 'SOURCE_ONLY_TEST_PASS_DOES_NOT_PROVE_BROWSER_UX_RUNTIME_RECEIVER_COEX_CANON_OR_DEPLOYMENT' > artifacts/comegathesis-r0/nonclaims.txt
          echo "Source-only CI gate: checked exact committed files. No browser, receiver or CoEx proof." >> "$GITHUB_STEP_SUMMARY"
      - name: CoWorkID inert process-replay regression (same host, not independent recovery)
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts/comegathesis-r0
          node --check scripts/test_coworkid_process_replay_r0.cjs
          node scripts/test_coworkid_process_replay_r0.cjs | tee artifacts/comegathesis-r0/coworkid-process-replay.log
          sha256sum scripts/test_coworkid_process_replay_r0.cjs > artifacts/comegathesis-r0/coworkid-process-replay.sha256
          echo "Inert same-host process-replay suite executed; NOT independent receiver or live recovery." >> "$GITHUB_STEP_SUMMARY"
      - name: Adversarial concurrency and sink fencing (inert same-host only)
        shell: bash
        run: |
          set -euo pipefail
          node --check scripts/test_coworkid_concurrent_fencing_r0.cjs
          node scripts/test_coworkid_concurrent_fencing_r0.cjs | tee artifacts/comegathesis-r0/coworkid-concurrent-fence.log
          sha256sum scripts/test_coworkid_concurrent_fencing_r0.cjs > artifacts/comegathesis-r0/coworkid-concurrent-fence.sha256
          echo "Concurrent same-host synthetic effect check; orphan lock quarantined, NO power-failure recovery." >> "$GITHUB_STEP_SUMMARY"
      - name: Non-cycling session residue source gate (not provider archive)
        shell: bash
        run: |
          set -euo pipefail
          node --check scripts/test_coci_session_residue_r0.cjs
          node scripts/test_coci_session_residue_r0.cjs | tee artifacts/comegathesis-r0/session-residue.log
          sha256sum scripts/test_coci_session_residue_r0.cjs ai/currentness/coci-session-noncycling-checkpoint-r0-20261120.json ai/currentness/coci-session-residue-gates-r0-20261120.json > artifacts/comegathesis-r0/session-residue.sha256
          echo "Source-only session residue check: non-cycling work, no UI archive, no global enforcement." >> "$GITHUB_STEP_SUMMARY"
      - name: Keep test log and source digests, even if a check failed
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: comegathesis-source-proof-${{ github.run_id }}
          path: artifacts/comegathesis-r0/
          if-no-files-found: warn
          retention-days: 30
  artifact-readback:
    name: Separate CI job exact-artifact readback (same provider, no runtime claim)
    needs: source-parity
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Retrieve source-job proof archive into separate CI job
        uses: actions/download-artifact@v4
        with:
          name: comegathesis-source-proof-${{ github.run_id }}
          path: artifacts/comegathesis-r0/
      - name: Verify exact source manifest, run revision, logs, and eight negative controls
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts/comegathesis-readback-r0
          node --check scripts/test_coci_artifact_readback_r0.cjs
          node scripts/test_coci_artifact_readback_r0.cjs artifacts/comegathesis-r0 artifacts/comegathesis-readback-r0 2>&1 | tee artifacts/comegathesis-readback-r0/readback-tests.log
          echo "CI artifact readback is GitHub-job-scoped, not an independent CoStead/X2 receiver." >> "$GITHUB_STEP_SUMMARY"
      - name: CoHereNow scope-bound proof front door (read-only)
        shell: bash
        run: |
          set -euo pipefail
          node --check scripts/render_coci_ci_status_r0.cjs
          node scripts/render_coci_ci_status_r0.cjs artifacts/comegathesis-readback-r0/coci-artifact-readback-receipt.json --self-test | tee artifacts/comegathesis-readback-r0/frontdoor-negative-tests.log
          node scripts/render_coci_ci_status_r0.cjs artifacts/comegathesis-readback-r0/coci-artifact-readback-receipt.json artifacts/comegathesis-readback-r0/cohere-ci-status.json artifacts/comegathesis-readback-r0/cohere-ci-status.md
          sha256sum artifacts/comegathesis-readback-r0/cohere-ci-status.json artifacts/comegathesis-readback-r0/cohere-ci-status.md > artifacts/comegathesis-readback-r0/cohere-ci-status.sha256
      - name: Retain receiving-job receipt and test evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coci-artifact-readback-proof-${{ github.run_id }}
          path: artifacts/comegathesis-readback-r0/
          if-no-files-found: warn
          retention-days: 30
  browser-smoke:
    name: Optional browser smoke (not independent acceptance)
    if: ${{ (github.event_name == 'workflow_dispatch' && inputs.run_browser) || (github.event_name == 'pull_request' && contains(github.event.pull_request.labels.*.name, 'comegathesis-browser')) }}
    needs: source-parity
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Chromium source reader smoke
        shell: bash
        run: |
          set -euo pipefail
          node --check scripts/test_comegathesis_browser_r0.cjs
          node scripts/test_comegathesis_browser_r0.cjs
      - name: Preserve screenshot evidence and negative claims
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: comegathesis-browser-proof-${{ github.run_id }}
          path: artifacts/comegathesis-r0/
          if-no-files-found: warn
          retention-days: 30
